<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="作戦盤">
<meta name="theme-color" content="#0b1016">
<title>TACBOARD – デジタル作戦盤</title>
<style>
:root{
  --bg:#0b1016;--panel:#121922;--panel2:#18212d;--panel3:#202b3a;--line:#253244;
  --text:#e8eef6;--muted:#8796aa;--accent:#38bdf8;--accent-ink:#03263a;
  --off:#2563eb;--def:#dc2626;--ball:#f97316;--danger:#ef4444;--memo:#fde68a;
  --sbw:292px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}

#app{position:absolute;inset:0;display:grid;grid-template-columns:var(--sbw) 0px minmax(0,1fr) 100px;grid-template-rows:minmax(0,1fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app.sb-off{--sbw:0px}
#app.sb-off #sidebar{visibility:hidden}
#sidebar{grid-column:1;grid-row:1}
#video{grid-column:2;grid-row:1;display:none}
#main{grid-column:3;grid-row:1}
#rail{grid-column:4;grid-row:1}
.sm{display:none}

/* ---------- Sidebar ---------- */
#sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sb-head{padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;letter-spacing:.08em;font-size:18px;line-height:1.1}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f97316,#c2410c);display:grid;place-items:center;flex:none}
.cat-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 10px}
.cat{min-height:56px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);text-align:left;padding:6px 10px 6px 12px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.cat b{font-size:13px;letter-spacing:.05em;color:var(--c)}
.cat span{font-size:12px;color:var(--text);font-weight:600;line-height:1.25;white-space:nowrap;letter-spacing:-.02em}
.cat .cnt{position:absolute;top:6px;right:8px;font-size:11px;color:var(--muted);font-weight:700}
.cat.active{background:var(--panel3);border-color:var(--c)}
.save-new{margin:0 12px 10px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.list-head{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 6px;font-size:12px;color:var(--muted);font-weight:700}
.play-list{flex:1;overflow-y:auto;padding:2px 12px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.play-item{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:7px;margin-bottom:8px;min-height:88px;width:100%;text-align:left}
.play-item.loaded{border-color:var(--accent);background:#0f2433}
.thumb{width:104px;height:74px;border-radius:8px;flex:none;background:#000;pointer-events:none}
.pi-body{flex:1;min-width:0;pointer-events:none}
.pi-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-memo{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.pi-more{width:40px;height:64px;font-size:22px;color:var(--muted);flex:none;border-radius:10px}
.empty{color:var(--muted);font-size:13px;line-height:1.6;padding:18px 8px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-foot .btn{height:44px;font-size:13.5px;padding:0 8px}
.sb-note{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;padding-top:2px}

/* ---------- Main ---------- */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0;height:66px;flex:none}
.ibtn{width:48px;height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.seg button{height:42px;padding:0 14px;border-radius:9px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.cur{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:left}
.badge{font-size:11px;font-weight:900;letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--c,#334155);color:#0b1016;flex:none}
.cur .t{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;flex:none}
.cur .m{font-size:13.5px;color:var(--memo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;font-weight:600}
.cur .free{color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:48px;padding:0 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{border-color:var(--accent);color:var(--accent);background:#0b2a3c}
.btn.danger{color:#fecaca;border-color:#7f1d1d;background:#2a1215}
.btn[hidden]{display:none}
.btn:active,.ibtn:active,.tool:active,.cat:active,.play-item:active,.save-new:active,.seg button:active,.preset:active{transform:scale(.96)}

#boardWrap{position:relative;flex:1;min-height:0;background:#070a0e;overflow:hidden}
#board{position:absolute;left:0;top:0;touch-action:none;-webkit-user-select:none;user-select:none}

#defbar{flex:none;height:70px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
.preset{flex:1;min-width:0;height:52px;border-radius:12px;background:var(--panel2);border:1.5px solid #4a2326;color:#fecaca;font-weight:800;font-size:15px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.preset small{font-size:10.5px;color:#f87171;font-weight:700;letter-spacing:.04em}
.dftoggle{flex:none;width:96px;height:52px;border-radius:12px;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--def);background:var(--def);color:#fff;line-height:1.1}
.dftoggle small{font-size:10.5px;font-weight:700;opacity:.9}
.dftoggle.off{background:transparent;color:#f87171;border-style:dashed}

/* ---------- Tool rail ---------- */
#rail{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px;padding:8px;overflow-y:auto;touch-action:pan-y}
.tool{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:800;color:#b6c2d2;background:var(--panel2);border:1.5px solid var(--line);flex:none;position:relative}
.tool svg{width:30px;height:30px}
.tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool.penline::after{content:"✎";position:absolute;top:2px;right:5px;font-size:10px;color:#facc15}
.tool.on.penline::after{color:var(--accent-ink)}
.tool:disabled{opacity:.35}
.rail-sep{height:1px;background:var(--line);margin:3px 2px;flex:none}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:none}
.sw{height:32px;border-radius:9px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sw.on{border-color:#fff}
.tool.warn{color:#fcd34d}
.tool.reset{color:#fca5a5}

/* ---------- MTG分析モード ---------- */
#modeSeg button{font-size:14px;padding:0 12px}
#app.mtg{grid-template-columns:0px minmax(0,1fr) minmax(0,1fr) 100px}
#app.mtg #video{display:flex}
#app.mtg #sidebar{position:absolute;left:0;top:0;bottom:0;width:300px;z-index:30;visibility:visible;transform:translateX(-102%);transition:transform .2s ease;box-shadow:10px 0 30px rgba(0,0,0,.55)}
#app.mtg.pb-open #sidebar{transform:none}
#app.mtg .lg{display:none}
#app.mtg .sm{display:inline}
#app.mtg #curPlay,#app.mtg #btnOverwrite{display:none}
#app.mtg #btnSaveTop{margin-left:auto}
#app.mtg #topbar{gap:6px}
#app.mtg .seg button{padding:0 10px;font-size:14px}
#app.mtg .btn{padding:0 11px;font-size:14px}
#app.mtg #defbar{gap:5px;padding:8px 6px}
#app.mtg .preset{font-size:13px}
.preset{min-width:48px;padding:0 4px}
#app.mtg .preset small,#app.mtg .dftoggle small{display:none}
#app.mtg .dftoggle{width:66px;font-size:12.5px}

#video{flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.v-url{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);height:66px;align-items:center;flex:none}
.v-url input{flex:1;min-width:0;height:48px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;padding:0 12px;outline:none}
.v-url input:focus{border-color:var(--accent)}
.player-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:none}
.player-box iframe,#ytPlayer{position:absolute;inset:0;width:100%;height:100%;border:0}
.v-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:14px;text-align:center;padding:20px;line-height:1.6;background:#05080b}
.v-empty b{color:var(--text);font-size:16px}
.v-ctrl{display:flex;gap:5px;padding:8px 10px 0;flex:none;align-items:center}
.vb{flex:1;min-width:0;height:48px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1.05;flex-direction:column}
.vb small{font-size:9.5px;font-weight:700;opacity:.75}
.vb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vb.loop.on{background:#14532d;border-color:#22c55e;color:#bbf7d0}
.vb.play{flex:1.2;background:#e8eef6;color:#0b1016;border-color:#e8eef6;font-size:18px}
.vb:active,.inout:active,.vsave:active,.chip:active,.clip-item:active{transform:scale(.96)}
.v-time{padding:6px 12px 0;font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;flex:none}
.v-time .clipnow{color:#86efac}
.v-clip{display:flex;gap:6px;padding:6px 10px 8px;flex:none}
.inout{flex:1;height:58px;border-radius:12px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1.15;letter-spacing:.04em}
.inout small{font-size:13px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0;opacity:.85}
.inout.in{border-color:#22c55e;color:#86efac;background:#0c2617}
.inout.out{border-color:#f97316;color:#fdba74;background:#2a1508}
.vsave{flex:1.35;height:58px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:15px;line-height:1.15}
.vsave small{display:block;font-size:10.5px;font-weight:700}
.v-kf{display:flex;gap:6px;padding:0 10px 8px;align-items:stretch;flex:none}
.kf-track{flex:1;min-width:0;position:relative;height:54px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);overflow:hidden}
.kf-cap{position:absolute;left:10px;right:10px;top:4px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.kf-cap b{color:#c4b5fd}
.kf-line{position:absolute;left:16px;right:16px;top:34px;height:4px;border-radius:2px;background:#334155;pointer-events:none}
.kf-head{position:absolute;top:21px;width:3px;height:30px;margin-left:-1.5px;background:#22c55e;border-radius:2px;pointer-events:none;display:none}
.kf-dot{position:absolute;top:24px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#8b5cf6;border:3px solid #ede9fe;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:10px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center}
.kf-dot.sel{background:#facc15;border-color:#fff;color:#1a1003}
.kf-add{width:118px;border-radius:12px;background:#7c3aed;color:#fff;font-weight:900;font-size:13px;line-height:1.25;flex:none}
.kf-add:disabled{opacity:.4}
.kf-sync{width:64px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-weight:900;font-size:13px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:#b6c2d2}
.kf-sync small{font-size:11px}
.kf-sync.on{background:#2e1065;border-color:#a78bfa;color:#ddd6fe}
.kf-add:active,.kf-sync:active,.kf-dot:active{transform:scale(.94)}
.tag.kf{--c:#a78bfa}
.v-filter{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;flex:none;touch-action:pan-x;scrollbar-width:none}
.v-filter::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line);font-size:13px;font-weight:800;white-space:nowrap;flex:none;color:#b6c2d2}
.chip.on{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:var(--panel3)}
.chip.scope{color:var(--text);border-color:#475569}
.clip-list{flex:1;overflow-y:auto;padding:0 10px 10px;touch-action:pan-y;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);padding-top:8px}
.clip-item{display:flex;gap:10px;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;align-items:flex-start;width:100%;text-align:left}
.clip-item.playing{border-color:#22c55e;background:#0c1f15}
.clip-thumb{width:84px;height:60px;border-radius:8px;flex:none;background:#000;object-fit:cover;pointer-events:none}
.ci-body{flex:1;min-width:0;pointer-events:none}
.ci-top{display:flex;align-items:center;gap:6px}
.ci-time{font-size:12px;font-weight:800;color:#86efac;font-variant-numeric:tabular-nums;background:#0c2617;border-radius:6px;padding:2px 6px;flex:none}
.ci-title{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;border:1px solid var(--c);color:var(--c)}
.tag.board{--c:var(--accent)}
.ci-memo{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clip-item.playing .ci-memo{display:block;color:var(--memo);font-size:14.5px;white-space:pre-wrap;font-weight:600}
.ci-more{width:36px;height:56px;font-size:22px;color:var(--muted);flex:none;border-radius:10px}
.vrow{display:flex;gap:8px}
.vrow > div{flex:1}
.check{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-size:15px;font-weight:700;color:var(--text)}
.check input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.sheet select{width:100%;height:50px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;padding:0 12px}
.vid-row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.vid-row img{width:96px;height:54px;border-radius:6px;object-fit:cover;background:#000;flex:none}
.vid-row .vt{flex:1;min-width:0;font-weight:700;font-size:14px}
.vid-row .vt small{display:block;color:var(--muted);font-size:12px;font-weight:600}

/* ---------- 2D / 3D ---------- */
#boardbar{flex:none;height:54px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#boardbar::-webkit-scrollbar{display:none}
#boardbar .seg{padding:2px}
#boardbar .seg button{height:38px;font-size:14.5px;padding:0 12px}
#viewSeg button small{font-size:10.5px;font-weight:700;opacity:.8;margin-left:4px}
#viewSeg button.on{background:#f59e0b;color:#1a1003}
#app.mtg #viewSeg small{display:none}
#camBar{display:none;gap:5px;align-items:center}
#app.v3d #camBar{display:flex}
#app.v3d #courtSeg{opacity:.7}
.cam{height:40px;padding:0 11px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.cam.eye{min-width:46px;padding:0 6px}
.cam.on{background:#f59e0b;border-color:#f59e0b;color:#1a1003}
.cam-sep{width:1px;height:28px;background:var(--line);margin:0 3px;flex:none}
.cam.tog{color:#b6c2d2}
.cam.tog.on{background:#0c2617;border-color:#22c55e;color:#86efac}
.cam:active{transform:scale(.95)}
#view3d{position:absolute;inset:0;display:none;background:#0b1016;touch-action:none;z-index:2}
#app.v3d #view3d{display:block}
#view3d canvas{display:block;touch-action:none}
.v3load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:15px}
.v3hint{position:absolute;left:10px;bottom:10px;background:rgba(8,12,18,.82);border:1px solid var(--line);color:#dbe4ef;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;pointer-events:none;max-width:calc(100% - 20px)}
#toast{z-index:10}

/* ---------- ライブ遅延 ---------- */
#live{display:none;flex:1;min-height:0;flex-direction:column;background:#000}
#app.live{grid-template-columns:0px 0px minmax(0,1fr) 0px}
#app.live #sidebar,#app.live #video,#app.live #rail{display:none}
#app.live #live{display:flex}
#app.live #boardbar,#app.live #boardWrap,#app.live #defbar,#app.live #btnSidebar,#app.live #curPlay,#app.live #btnOverwrite,#app.live #btnSaveTop{display:none}
.lv-top{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;touch-action:pan-x}
.lv-lbl{font-size:13px;color:var(--muted);font-weight:800;margin-left:6px;flex:none}
.lv-delays{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
.lv-delays::-webkit-scrollbar,.lv-top::-webkit-scrollbar{display:none}
.lv-dseg{flex:none}
.lv-dseg button{min-width:58px;font-size:15.5px}
.lv-dseg button.on{background:#facc15;color:#1a1003}
.lv-custom{display:flex;gap:6px;flex:none;align-items:center}
.lv-custom input{width:76px;height:48px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);color:var(--text);font-size:17px;text-align:center;font-weight:800}
.lv-custom input.on{border-color:#facc15;color:#fde68a}
.lv-info{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;margin-left:auto;padding-left:8px;font-variant-numeric:tabular-nums}
.lv-seek{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);flex:none}
.lv-jump{flex:none;min-width:58px;height:52px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-weight:900;font-size:14px;line-height:1.15}
.lv-jump:disabled{opacity:.35}
.lv-follow{background:#7c2d12;border-color:#f97316;color:#ffedd5;font-size:12px;min-width:84px}
.lv-follow[hidden]{display:none}
.lv-bar-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#lvSeek{width:100%;height:30px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;touch-action:none}
#lvSeek::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(90deg,#334155,#475569)}
#lvSeek::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#facc15;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#lvSeek::-moz-range-track{height:10px;border-radius:999px;background:#475569}
#lvSeek::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#facc15;border:4px solid #fff}
#lvSeek:disabled{opacity:.4}
.lv-seek-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.lv-seek-lbl b{color:#fde68a}
.lv-stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
.lv-main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;background:#000}
.lv-main.show{opacity:1}
.mirror{transform:scaleX(-1)}
.lv-pip{position:absolute;right:12px;top:12px;width:24%;max-width:300px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.7);background:#111;z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.lv-pip.hide{display:none}
.lv-badge{position:absolute;left:12px;top:12px;z-index:4;padding:8px 14px;border-radius:999px;font-weight:900;font-size:17px;background:rgba(220,38,38,.92);color:#fff;letter-spacing:.03em}
.lv-badge.paused{background:rgba(250,204,21,.95);color:#1a1003}
.lv-badge:empty{display:none}
.lv-count{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:3;color:#fff;text-align:center;padding:20px;background:rgba(0,0,0,.55);line-height:1.6}
.lv-count.show{display:flex}
.lv-count b{font-size:140px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#facc15}
.lv-count big{font-size:22px;font-weight:900}
.lv-count small{font-size:15px;color:#cbd5e1;font-weight:700}
.lv-bar{width:min(420px,70%);height:10px;border-radius:999px;background:#334155;overflow:hidden;margin-top:14px}
.lv-bar i{display:block;height:100%;background:#facc15}
.lv-freeze{position:absolute;inset:0;border:8px solid #facc15;pointer-events:none;display:none;z-index:3}
.lv-freeze.show{display:block}
.lv-bottom{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);flex:none}
.lv-pause{flex:1;height:64px;border-radius:18px;font-size:23px;font-weight:900;background:#facc15;color:#1a1003}
.lv-pause.paused{background:#22c55e;color:#04210f}
.lv-pause:disabled,.lv-step:disabled{opacity:.35}
.lv-step{width:120px;height:64px;border-radius:18px;background:var(--panel2);border:1.5px solid var(--line);font-weight:900;font-size:16px}
.lv-pause:active,.lv-step:active{transform:scale(.97)}

/* ---------- 使い方ガイド ---------- */
.help-btn{color:#fde68a;border-color:#5b4a14;background:#221c08}
#app.live .help-btn{margin-left:auto}
.sheet.help{width:min(780px,96vw);padding:0;display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.help-head{padding:20px 22px 12px;border-bottom:1px solid var(--line);flex:none}
.help-head h2{margin:0 0 4px;font-size:22px}
.help-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.help-body{overflow-y:auto;padding:14px 22px 18px;flex:1;-webkit-user-select:text;user-select:text}
.help-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.help-mode{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.help-mode b{display:block;font-size:15px;margin-bottom:4px}
.help-mode span{font-size:12.5px;color:var(--muted);line-height:1.5;display:block}
.help-body details{border:1.5px solid var(--line);border-radius:14px;background:var(--panel2);margin-bottom:8px;overflow:hidden}
.help-body summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;min-height:52px}
.help-body summary::-webkit-details-marker{display:none}
.help-body summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:900}
.help-body details[open] summary::after{content:"－"}
.help-body details[open] summary{border-bottom:1px solid var(--line)}
.help-body ol,.help-body ul{margin:10px 0;padding:0 16px 0 36px;line-height:1.75;font-size:14.5px}
.help-body li b{color:#fde68a}
.help-body .note{margin:6px 14px 14px;padding:10px 12px;border-radius:10px;background:#221c08;border:1px solid #5b4a14;color:#fde68a;font-size:13.5px;line-height:1.6}
.help-foot{display:flex;align-items:center;gap:12px;padding:12px 22px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;background:var(--panel)}
.help-foot label{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;flex:1;min-height:48px;cursor:pointer}
.help-foot input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.help-foot .btn{min-width:140px;height:52px}

/* ---------- ステップ再生バー ---------- */
#stepbar{flex:none;height:62px;display:flex;align-items:center;gap:6px;padding:8px 10px 6px;background:#0f1620;border-top:1px solid var(--line);position:relative}
#app.live #stepbar{display:none}
.st-prog{position:absolute;left:0;right:0;top:0;height:3px;background:transparent}
.st-prog i{display:block;height:100%;width:0;background:#22c55e}
.st-add{flex:none;height:46px;padding:0 12px;border-radius:12px;background:#0e7490;color:#ecfeff;font-weight:900;font-size:14px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.st-add small{font-size:10px;font-weight:700;opacity:.85}
.st-chips{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;align-items:center}
.st-chips::-webkit-scrollbar{display:none}
.st-chip{flex:none;min-width:44px;height:40px;padding:0 8px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line);font-weight:900;font-size:13px;color:#b6c2d2}
.st-chip.cur{border-color:#22c55e;color:#86efac;background:#0c2617}
.st-chip.sel{border-color:#facc15;color:#fde68a}
.st-empty{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-btn{flex:none;width:48px;height:46px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-size:19px;font-weight:900}
.st-btn:disabled{opacity:.35}
.st-play{background:#16a34a;border-color:#16a34a;color:#fff;width:56px}
.st-play.on{background:#facc15;border-color:#facc15;color:#1a1003}
.st-speed{flex:none;padding:2px}
.st-speed button{height:40px;padding:0 9px;font-size:13px}
#app.mtg .st-speed button{padding:0 6px;font-size:12px}
#app.mtg .st-add{padding:0 8px;font-size:13px}
.st-add:active,.st-btn:active,.st-chip:active{transform:scale(.95)}
.st-badge{display:inline-block;font-size:10.5px;font-weight:900;background:#16a34a;color:#fff;border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:2px}
.tag.link{--c:#4ade80}
#localVid{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;display:none}
.player-box.local #localVid{display:block}
.player-box.local iframe,.player-box.local #ytPlayer{display:none}
.vtrace{flex:none;width:64px;height:58px;border-radius:12px;background:#1e1b4b;border:1.5px solid #6366f1;color:#c7d2fe;font-weight:900;font-size:12px;line-height:1.2}
.vtrace small{display:block;font-size:9.5px;opacity:.8}

/* ---------- UX仕上げ：タッチ領域48px以上・大きなカード ---------- */
#topbar{height:70px}
.seg button{min-height:48px}
#boardbar{height:66px}
#boardbar .seg button{height:48px;font-size:15px;padding:0 14px}
.cam{height:48px;font-size:14.5px}
.chip{height:48px;padding:0 15px;font-size:13.5px}
#stepbar{height:70px}
.st-add{height:50px;min-width:118px}
.st-btn{width:52px;height:50px}
.st-play{width:auto;min-width:104px;padding:0 14px;font-size:16px}
.st-play.flash{animation:flash 0.8s ease 3}
@keyframes flash{50%{box-shadow:0 0 0 6px rgba(34,197,94,.45);transform:scale(1.05)}}
.st-chip{height:50px;min-width:50px}
.st-speed button{height:48px;min-width:50px;padding:0 6px}
#app.mtg .st-speed{display:none}
#app.mtg .st-play{min-width:88px}
#btnVFile{min-width:48px;padding:0 10px}
.pi-more,.ci-more{width:48px;min-height:56px}
.kf-dot{width:46px;height:46px;margin-left:-23px;top:6px;background:transparent;border:none;box-shadow:none;display:flex;align-items:center;justify-content:center;padding:0}
.kf-dot span{width:26px;height:26px;border-radius:50%;background:#8b5cf6;border:3px solid #ede9fe;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:10px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center}
.kf-dot.sel span{background:#facc15;border-color:#fff;color:#1a1003}
.ibtn{min-width:48px;min-height:48px}
.menu-btn{font-size:22px;background:var(--panel2)}
#app.live .menu-btn{margin-left:auto}
.color-dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#app.rec .st-add{background:#dc2626;color:#fff;animation:recPulse 1.4s infinite}
@keyframes recPulse{50%{box-shadow:0 0 0 6px rgba(220,38,38,.35)}}
#recBadge{position:absolute;left:12px;top:12px;z-index:6;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(127,29,29,.92);color:#fff;font-weight:900;font-size:15px;letter-spacing:.04em;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none}
#recBadge i{width:12px;height:12px;border-radius:50%;background:#ef4444;box-shadow:0 0 10px #ef4444;animation:blink 1s infinite}
#recBadge small{font-size:11.5px;font-weight:700;opacity:.85;letter-spacing:0}
#recBadge.tick{animation:tick .5s}
@keyframes blink{50%{opacity:.25}}
@keyframes tick{30%{transform:scale(1.08);background:rgba(22,163,74,.95)}}
#app.rec #recBadge{display:flex}
#quickwrap{flex:none;background:#0d141c;border-top:1px solid var(--line)}
#app.mtg #quickwrap,#app.live #quickwrap{display:none}
#qtabs{display:flex;gap:6px;padding:7px 10px 0;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
#qtabs::-webkit-scrollbar{display:none}
.qtab{flex:none;min-width:72px;height:50px;padding:0 12px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;position:relative}
.qtab b{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--c,#cbd5e1)}
.qtab span{font-size:13.5px;font-weight:800;color:var(--text);white-space:nowrap}
.qtab i{position:absolute;top:3px;right:6px;font-style:normal;font-size:10px;font-weight:800;color:var(--muted)}
.qtab.on{border-color:var(--c,#38bdf8);background:var(--panel3);box-shadow:0 0 0 1px var(--c,#38bdf8) inset}
.qtab.empty{opacity:.5}
.qtab:active{transform:scale(.96)}
.qempty{flex:none;display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
#quickbar{flex:none;height:90px;display:flex;gap:8px;padding:7px 10px 9px;overflow-x:auto;background:#0d141c;border-top:1px solid var(--line);touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:none}
#quickbar::-webkit-scrollbar{display:none}
.qcard{flex:none;width:236px;height:74px;display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:var(--panel2);border:1.5px solid var(--line);text-align:left;scroll-snap-align:start;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#38bdf8)}
.qcard.on{border-color:#22c55e;background:#0c2617}
.qcard:active{transform:scale(.96)}
.qthumb{width:76px;height:56px;border-radius:8px;flex:none;pointer-events:none;margin-left:4px}
.qbody{display:flex;flex-direction:column;min-width:0;gap:2px;pointer-events:none}
.qcat{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--c,#38bdf8)}
.qtitle{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsub{font-size:11.5px;color:#86efac;font-weight:700}
.qadd{width:190px;border-style:dashed;justify-content:center}
.qadd::before{display:none}
.qplus{font-size:30px;font-weight:300;color:var(--accent);margin-right:2px}
.qadd .qsub{color:var(--muted)}
.sheet.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);max-height:none;border-radius:22px 0 0 22px;padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.menu-head b{font-size:20px}
.menu-sec{font-size:12px;font-weight:800;color:var(--muted);margin:14px 6px 6px;letter-spacing:.05em}
.mrow{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px;text-align:left}
.mrow:active{transform:scale(.98)}
.mi{width:36px;height:36px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;font-size:18px;flex:none}
.mt{font-size:15.5px;font-weight:800;display:flex;flex-direction:column}
.mt small{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

/* ---------- Toast / modal ---------- */
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(10px);background:rgba(15,23,32,.94);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.open{display:flex}
.sheet{width:min(580px,94vw);max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 14px;font-size:20px}
.sheet label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 6px}
.sheet input[type=text],.sheet textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;color:var(--text);font-size:17px;padding:12px 14px;outline:none}
.sheet input[type=text]:focus,.sheet textarea:focus{border-color:var(--accent)}
.sheet textarea{resize:none;line-height:1.5}
.mcat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mcat button{min-height:50px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-weight:800;font-size:13.5px;padding:4px;line-height:1.25}
.mcat button small{display:block;font-size:10.5px;color:var(--c);letter-spacing:.05em}
.mcat button.on{border-color:var(--c);background:var(--panel3)}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.mactions .btn{min-width:120px;height:52px}
.alist{display:flex;flex-direction:column;gap:8px}
.alist .btn{width:100%;height:54px;justify-content:flex-start;padding:0 18px;font-size:16px}
.bigmemo{font-size:26px;line-height:1.55;font-weight:700;color:var(--memo);white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.msub{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
</style>
</head>
<body>
<div id="app">
  <!-- ========== Sidebar: Playbook ========== -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5v19M5.3 5.3c3.4 3.4 3.4 10 0 13.4M18.7 5.3c-3.4 3.4-3.4 10 0 13.4"/></svg>
      </div>
      <div class="logo">TACBOARD<small>作戦盤 ＆ セットプレー</small></div>
    </div>
    <div id="catTabs" class="cat-tabs"></div>
    <button id="btnSaveNew" class="save-new">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      現在の盤面を保存
    </button>
    <div class="list-head"><span id="listTitle"></span><span>タップで呼び出し</span></div>
    <div id="playList" class="play-list scrollable"></div>
    <div class="sb-foot">
      <div class="sb-note">✓ このiPadに自動保存（書き出しは ⚙️）</div>
    </div>
  </aside>

  <!-- ========== Video (MTG) ========== -->
  <section id="video">
    <div class="v-url">
      <input type="url" id="vUrl" placeholder="YouTubeのURL（限定公開・youtu.be 可）" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn primary" id="btnVLoad">読込</button>
      <button class="btn" id="btnVFile" title="端末の動画ファイル">📁</button>
      <button class="btn" id="btnVHist">履歴</button>
    </div>
    <input type="file" id="localFile" accept="video/*" hidden>
    <div class="player-box" id="playerBox">
      <video id="localVid" playsinline controls></video>
      <div id="ytPlayer"></div>
      <div class="v-empty" id="vEmpty"><b>YouTube動画を読み込んでください</b>URLを上に貼り付けて「読込」。<br>限定公開の試合動画もそのまま使えます。</div>
    </div>
    <div class="v-time"><span id="vTime">0:00.0 / 0:00.0</span><span id="vClipNow" class="clipnow"></span></div>
    <div class="v-ctrl">
      <button class="vb" id="vBack">−5秒</button>
      <button class="vb play" id="vPlay">▶</button>
      <button class="vb" id="vFwd">+5秒</button>
      <button class="vb" data-rate="0.5">0.5x<small>スロー</small></button>
      <button class="vb" data-rate="0.75">0.75x</button>
      <button class="vb" data-rate="1">1.0x<small>標準</small></button>
      <button class="vb loop" id="vLoop">ループ<small>ON</small></button>
    </div>
    <div class="v-clip">
      <button class="inout in" id="vIn">IN<small id="vInT">--:--</small></button>
      <button class="inout out" id="vOut">OUT<small id="vOutT">--:--</small></button>
      <button class="vsave" id="vSave">＋ クリップ保存<small>タイトル・タグ・メモ</small></button>
      <button class="vtrace" id="vTrace">🧪自動<br>トレース<small>β</small></button>
    </div>
    <div class="v-kf" id="vKf">

<script>
(() => {
'use strict';

/* =====================================================================
   定数
   ===================================================================== */
const VERSION = 2;
const LS_CUR = 'tacboard.v1.current';
const LS_PLAYS = 'tacboard.v1.plays';
const LS_SET = 'tacboard.v1.settings';
const LS_CLIPS = 'tacboard.v1.clips';
const LS_VID = 'tacboard.v1.video';
const TAG_PRESETS = [
  { n: 'オフェンス改善', c: '#38bdf8' },
  { n: 'ディフェンス改善', c: '#f87171' },
  { n: 'ナイスプレー', c: '#4ade80' },
  { n: 'TOV', c: '#f59e0b' },
];
const tagColor = t => (TAG_PRESETS.find(x => x.n === t) || { c: '#c4b5fd' }).c;
const TAU = Math.PI * 2;
// FIBA コート（m）：長さ28 × 幅15。オフェンスは右ゴール（x=28側）を攻める
const BX = 28 - 1.575, BY = 7.5;

const CATS = [
  { id: 'blob',  short: 'BLOB',  name: 'エンドスロー',       color: '#f59e0b' },
  { id: 'slob',  short: 'SLOB',  name: 'サイドスロー',       color: '#a78bfa' },
  { id: 'half',  short: 'SET',   name: 'ハーフコートセット', color: '#38bdf8' },
  { id: 'zone',  short: 'ZONE',  name: 'ゾーンアタック',     color: '#4ade80' },
  { id: 'press', short: 'PRESS', name: 'プレスアタック',     color: '#f472b6' },
  { id: 'def',   short: 'DEF',   name: 'ディフェンス',       color: '#f87171' },
  { id: 'zdef',  short: 'ZONE DF', name: 'ゾーンディフェンス', color: '#fb923c' },
];
const catById = id => CATS.find(c => c.id === id) || CATS[2];

const ICON = (inner) => `<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const TOOLS = [
  { id: 'move',    name: '駒を移動', icon: ICON('<path d="M14 3v22M3 14h22M14 3l-3.5 3.5M14 3l3.5 3.5M14 25l-3.5-3.5M14 25l3.5-3.5M3 14l3.5-3.5M3 14l3.5 3.5M25 14l-3.5-3.5M25 14l-3.5 3.5"/>') },
  { id: 'pass',    name: 'パス',     icon: ICON('<path d="M3 14h15" stroke-dasharray="3.2 3"/><path d="M25.5 14L18 9.5v9z" fill="currentColor" stroke="none"/>') },
  { id: 'dribble', name: 'ドリブル', icon: ICON('<path d="M3 14q2-5 4 0t4 0t4 0t4 0" stroke-width="2.2"/><path d="M25.5 14L19 10v8z" fill="currentColor" stroke="none"/>') },
  { id: 'cut',     name: 'カット',   icon: ICON('<path d="M3 14h15"/><path d="M25.5 14L18 9.5v9z" fill="currentColor" stroke="none"/>') },
  { id: 'screen',  name: 'スクリーン', icon: ICON('<path d="M3 14h18"/><path d="M21 6.5v15" stroke-width="3.2"/>') },
  { id: 'free',    name: 'フリー',   icon: ICON('<path d="M3 19C7 6 11 23 15 12s7-5 10 1"/>') },
  { id: 'erase',   name: '消しゴム', icon: ICON('<path d="M5 18.5l9.5-9.5 7 7-5.5 5.5H8z"/><path d="M12.5 23.5H24"/>') },
];
const LINE_TOOLS = ['pass', 'dribble', 'cut', 'screen', 'free'];
const COLORS = ['#111827', '#1d4ed8', '#c81e1e', '#0f7b3f'];

/* =====================================================================
   ユーティリティ
   ===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast('⚠ 端末に保存できませんでした（容量・プライベートモードを確認）'); return false; }
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
   盤面データ
   ===================================================================== */
const DEFAULT_O = [[19.2, 7.5], [22.3, 2.0], [22.3, 13.0], [25.6, 4.3], [25.6, 10.7]];

function presetPositions(kind, pieces) {
  switch (kind) {
    case 'man':
      return [1, 2, 3, 4, 5].map(i => {
        const o = pieces.find(p => p.id === 'O' + i);
        const dx = BX - o.x, dy = BY - o.y, dist = Math.hypot(dx, dy) || 1;
        const k = Math.min(1.4, dist * 0.35);
        return [r2(o.x + dx / dist * k), r2(o.y + dy / dist * k)];
      });
    case 'z23':   return [[21.0, 5.4], [21.0, 9.6], [25.2, 2.8], [25.2, 12.2], [25.6, 7.5]];
    case 'z32':   return [[19.8, 7.5], [21.8, 3.0], [21.8, 12.0], [25.4, 5.0], [25.4, 10.0]];
    case 'press': return [[1.4, 8.4], [4.8, 3.6], [4.8, 11.4], [12.0, 7.5], [22.0, 7.5]];
    case 'z113': return [[19.6, 7.5], [22.3, 7.5], [25.4, 3.0], [25.4, 12.0], [25.9, 7.5]];          // トップ・ハイポスト・ベースライン3人
    case 'press221': return [[6.5, 4.8], [6.5, 10.2], [12.5, 3.2], [12.5, 11.8], [21.5, 7.5]];       // 前線2・中盤2・セーフティ1
  }
  return null;
}
const PRESET_NAMES = { man: 'マンツーマン', z23: '2-3ゾーン', z32: '3-2ゾーン', z113: '1-1-3ゾーン', press: '1-2-1-1プレス', press221: '2-2-1プレス' };

function mkBoard(o, dKind, drawings = [], opts = {}) {
  const pieces = o.map((p, i) => ({ id: 'O' + (i + 1), team: 'o', label: String(i + 1), x: p[0], y: p[1] }));
  const d = Array.isArray(dKind) ? dKind : presetPositions(dKind, pieces);
  d.forEach((p, i) => pieces.push({ id: 'D' + (i + 1), team: 'd', label: 'X' + (i + 1), x: p[0], y: p[1] }));
  return {
    pieces,
    ball: { x: o[0][0], y: o[0][1], holder: opts.holder || 'O1' },
    drawings,
    showDef: opts.showDef !== false,
    court: opts.court || 'half',
  };
}
function defaultBoard(court = 'half') { return mkBoard(DEFAULT_O, 'man', [], { court }); }

function validBoard(b) {
  return b && Array.isArray(b.pieces) && b.pieces.length === 10 && b.ball && Array.isArray(b.drawings)
    && b.pieces.every(p => typeof p.x === 'number' && typeof p.y === 'number');
}
function boardOf(st) {
  return { pieces: clone(st.pieces), ball: clone(st.ball), drawings: clone(st.drawings), showDef: !!st.showDef, court: st.court === 'full' ? 'full' : 'half',
    steps: normalizeSteps(st.steps) };
}
// セットプレーの一連の動き（Step 1 → 2 → 3 …）
function normalizeSteps(arr) {
  if (!Array.isArray(arr) || !arr.length) return [];
  return normalizeKeys(arr.map((x, i) => Object.assign({}, x, { t: i }))).map(k => ({ pieces: k.pieces, ball: k.ball, showDef: k.showDef }));
}

function samplePlays() {
  const now = Date.now();
  const red = '#c81e1e', blk = '#111827';
  return [
    {
      id: uid() + 'a', cat: 'blob', title: 'ボックス：バックスクリーン',
      memo: '4が5へバックスクリーン→5はリングへ。2はコーナー、3はトップでセーフティ。第1オプションは5のゴール下。',
      board: mkBoard([[28.7, 9.6], [22.4, 9.4], [22.4, 5.6], [25.8, 9.4], [25.8, 5.6]], 'man', [
        { type: 'screen', color: blk, pts: [[25.8, 9.4], [25.85, 8.4], [25.9, 7.4], [25.9, 6.6]] },
        { type: 'cut', color: blk, pts: [[25.8, 5.6], [25.0, 6.1], [24.9, 7.3], [25.6, 8.3], [26.5, 8.8]] },
        { type: 'cut', color: blk, pts: [[22.4, 9.4], [23.8, 11.2], [25.5, 12.8], [27.0, 13.5]] },
        { type: 'cut', color: blk, pts: [[22.4, 5.6], [21.2, 6.4], [19.8, 7.3]] },
        { type: 'pass', color: red, pts: [[28.7, 9.6], [26.5, 8.8]] },
      ], { showDef: false }),
      createdAt: now, updatedAt: now,
    },
    {
      id: uid() + 'b', cat: 'zone', title: '2-3攻略：ハイポスト・フラッシュ',
      memo: '5がハイポストへフラッシュしてキャッチ。4はベースラインからリングへダイブ。X5が5に出たら4へハイ・ロー。',
      board: mkBoard([[19.2, 7.5], [21.6, 2.4], [21.6, 12.6], [26.6, 2.6], [22.4, 7.5]], 'z23', [
        { type: 'pass', color: blk, pts: [[19.2, 7.5], [22.1, 7.5]] },
        { type: 'cut', color: blk, pts: [[26.6, 2.6], [26.5, 4.3], [26.1, 6.3]] },
        { type: 'pass', color: red, pts: [[22.4, 7.5], [25.9, 6.6]] },
      ]),
      createdAt: now + 1, updatedAt: now + 1,
    },
    {
      id: uid() + 'c', cat: 'def', title: '1-2-1-1プレス：エンドからのトラップ',
      memo: '1→2へのパスでX1・X2がトラップ。X3はミドルを締め、X4はサイドライン沿いのパスを狙う。X5はセーフティ。',
      board: mkBoard([[-0.7, 9.0], [3.2, 3.5], [3.2, 11.5], [10.5, 7.5], [19.0, 7.5]], 'press', [
        { type: 'pass', color: blk, pts: [[-0.7, 9.0], [3.2, 3.5]] },
        { type: 'cut', color: red, pts: [[1.4, 8.4], [2.0, 6.6], [2.9, 4.7]] },
        { type: 'cut', color: red, pts: [[4.8, 11.4], [6.4, 8.8], [7.8, 6.2]] },
        { type: 'cut', color: red, pts: [[12.0, 7.5], [10.8, 5.4], [9.4, 3.2]] },
      ], { court: 'full' }),
      createdAt: now + 2, updatedAt: now + 2,
    },
  ];
}

/* =====================================================================
   アプリ状態
   ===================================================================== */
let S = lsGet(LS_CUR);
if (!validBoard(S)) S = Object.assign(defaultBoard(), { playId: null });
if (S.court !== 'full') S.court = 'half';

let plays = lsGet(LS_PLAYS);
if (!Array.isArray(plays)) { plays = samplePlays(); lsSet(LS_PLAYS, plays); }

if (S.clipId === undefined) S.clipId = null;

let clips = lsGet(LS_CLIPS);
if (!Array.isArray(clips)) clips = [];
const V = Object.assign({ videos: [], cur: null, inT: null, outT: null, loop: true, rate: 1, scope: 'video', tag: 'all', sync: true, editClipId: null, pendingKeys: [] }, lsGet(LS_VID) || {});
if (!Array.isArray(V.pendingKeys)) V.pendingKeys = [];
if (!Array.isArray(V.videos)) V.videos = [];

const settings = Object.assign({
  theme: 'wood', pencil: false, pencilAsked: false, color: COLORS[0],
  tool: 'move', lastLine: 'cut', cat: 'blob', sidebar: true, mode: 'court', autoFace: true, vision: false,
}, lsGet(LS_SET) || {});
if (!plays.some(p => p.cat === settings.cat) && plays.length) settings.cat = plays[0].cat;
if (!settings.uxV8) { settings.uxV8 = true; settings.sidebar = false; }

const history = [];
const SEL = { id: null, lastTap: null, hintShown: 0 }; // タップで選んだ選手
const active = new Map(); // pointerId -> 操作中情報

/* =====================================================================
   DOM
   ===================================================================== */
const app = $('#app');
const wrap = $('#boardWrap');
const canvas = $('#board');
const ctx = canvas.getContext('2d');
const courtCache = document.createElement('canvas');
let view = null, R = 22, dpr = 1, cssW = 0, cssH = 0;

/* =====================================================================
   座標変換（コート座標[m] ⇔ 画面座標[px]）
   フル：右ゴールが右側 / ハーフ：右ゴールを上にした縦向き表示
   ===================================================================== */
function computeView(court, w, h, pad) {
  if (court === 'full') {
    const VW = 31, VH = 18; // x:-1.5〜29.5, y:-1.5〜16.5
    const s = Math.max(0.1, Math.min((w - pad * 2) / VW, (h - pad * 2) / VH));
    const ox = (w - VW * s) / 2, oy = (h - VH * s) / 2;
    return { court, s, a: s, b: 0, c: 0, d: s, e: ox + 1.5 * s, f: oy + 1.5 * s, vr: [-1.5, -1.5, 31, 18] };
  }

/* =====================================================================
   コート描画
   ===================================================================== */
function drawCourt(c, v, w, h, theme, scale, simple) {
  const wood = theme === 'wood';
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.fillStyle = wood ? '#070a0e' : '#9aa6b5';
  c.fillRect(0, 0, w, h);

  c.setTransform(scale * v.a, scale * v.b, scale * v.c, scale * v.d, scale * v.e, scale * v.f);
  const [vx, vy, vw, vh] = v.vr;
  c.save();
  c.beginPath(); c.rect(vx, vy, vw, vh); c.clip();

  // 床
  if (wood) {
    if (simple) { c.fillStyle = '#dcae72'; c.fillRect(vx, vy, vw, vh); }
    else {
      const rnd = mulberry32(20261126);
      const sw = 0.42;
      for (let y = -1.5; y < 16.5; y += sw) {
        let x = -1.5 - rnd() * 4;
        while (x < 29.5) {
          const len = 2.2 + rnd() * 4;
          const l = 63 + rnd() * 9, sat = 48 + rnd() * 12, hue = 31 + rnd() * 5;
          c.fillStyle = `hsl(${hue},${sat}%,${l}%)`;
          c.fillRect(x, y, len + 0.01, sw + 0.01);
          c.fillStyle = 'rgba(95,52,18,.16)';
          c.fillRect(x, y, 0.03, sw);
          x += len;
        }
        c.fillStyle = 'rgba(95,52,18,.12)';
        c.fillRect(-1.5, y, 31, 0.018);
      }
    }
  } else {
    c.fillStyle = '#ffffff'; c.fillRect(vx, vy, vw, vh);
  }

  // アウトオブバウンズ
  c.beginPath(); c.rect(vx, vy, vw, vh); c.rect(0, 0, 28, 15);
  c.fillStyle = wood ? 'rgba(70,32,8,.38)' : '#e3e8ef';
  c.fill('evenodd');

  // ペイント・センターサークル
  const paint = wood ? 'rgba(30,64,175,.28)' : '#dbe7fb';
  c.fillStyle = paint;
  c.fillRect(0, 5.05, 5.8, 4.9); c.fillRect(22.2, 5.05, 5.8, 4.9);
  c.beginPath(); c.arc(14, 7.5, 1.8, 0, TAU); c.fill();

  // ライン
  const lc = wood ? 'rgba(28,22,20,.82)' : '#1e293b';
  c.strokeStyle = lc;
  c.lineWidth = Math.max(0.05, 1.4 / v.s);
  c.lineCap = 'butt';
  c.strokeRect(0, 0, 28, 15);
  line(c, 14, 0, 14, 15);
  c.beginPath(); c.arc(14, 7.5, 1.8, 0, TAU); c.stroke();

  const ang = Math.atan2(6.6, 1.415);
  for (const side of [0, 1]) {
    const base = side ? 28 : 0, dir = side ? -1 : 1, bx = base + dir * 1.575;
    c.strokeStyle = lc;
    c.lineWidth = Math.max(0.05, 1.4 / v.s);
    c.strokeRect(side ? 22.2 : 0, 5.05, 5.8, 4.9);
    const fx = base + dir * 5.8;
    // フリースローサークル（コート側は実線、ペイント側は破線）
    c.beginPath();
    if (side) c.arc(fx, 7.5, 1.8, Math.PI / 2, Math.PI * 1.5); else c.arc(fx, 7.5, 1.8, -Math.PI / 2, Math.PI / 2);
    c.stroke();
    c.save(); c.setLineDash([0.3, 0.25]); c.beginPath();
    if (side) c.arc(fx, 7.5, 1.8, -Math.PI / 2, Math.PI / 2); else c.arc(fx, 7.5, 1.8, Math.PI / 2, Math.PI * 1.5);
    c.stroke(); c.restore();
    // 3ポイントライン
    const tx = base + dir * 2.99;
    line(c, base, 0.9, tx, 0.9); line(c, base, 14.1, tx, 14.1);
    c.beginPath();
    if (side) c.arc(bx, 7.5, 6.75, Math.PI - ang, Math.PI + ang); else c.arc(bx, 7.5, 6.75, -ang, ang);
    c.stroke();
    // ノーチャージセミサークル
    c.beginPath();
    if (side) c.arc(bx, 7.5, 1.25, Math.PI / 2, Math.PI * 1.5); else c.arc(bx, 7.5, 1.25, -Math.PI / 2, Math.PI / 2);
    c.stroke();
    // バックボード・リング
    c.lineWidth = Math.max(0.09, 2.6 / v.s);
    c.strokeStyle = wood ? '#1f2937' : '#0f172a';
    line(c, base + dir * 1.2, 6.6, base + dir * 1.2, 8.4);
    c.lineWidth = Math.max(0.06, 2 / v.s);
    c.strokeStyle = '#ea580c';
    line(c, base + dir * 1.2, 7.5, bx - dir * 0.225, 7.5);
    c.beginPath(); c.arc(bx, 7.5, 0.225, 0, TAU); c.stroke();
  }
  c.restore();

}

/* =====================================================================
   描画（線）
   ===================================================================== */
function chaikin(p, it) {

}

    while (seg >= need && seg > 0) {
      const t = need / seg;
      ax += (bx - ax) * t; ay += (by - ay) * t;
      dist += need; out.push({ x: ax, y: ay, s: dist });
      seg -= need; need = step;

}

  const ang = Math.atan2(end.y - back.y, end.x - back.x);

    const e = pointAt(P, Math.max(0, L - ah * 0.7)); c.lineTo(e.x, e.y); c.stroke();

  }

/* =====================================================================
   駒の描画
   ===================================================================== */
function ballScreen(v, st, r) {
  const b = st.ball; if (!b) return null;
  if (b.holder) {
    const h = st.pieces.find(p => p.id === b.holder);
    if (h && !(h.team === 'd' && !st.showDef)) { const [sx, sy] = toS(v, h.x, h.y); return [sx + r * 0.78, sy - r * 0.78]; }
  }
  return toS(v, b.x, b.y);
}
function drawPiece(c, x, y, r, p, lift) {
  c.save();
  c.shadowColor = 'rgba(0,0,0,.38)'; c.shadowBlur = r * (lift ? 0.6 : 0.28); c.shadowOffsetY = r * (lift ? 0.25 : 0.1);
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  if (p.team === 'o') { g.addColorStop(0, '#5b95ff'); g.addColorStop(1, '#1d46c9'); }
  else { g.addColorStop(0, '#ff6b6b'); g.addColorStop(1, '#b3191b'); }
  c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = Math.max(1, r * 0.12); c.strokeStyle = '#ffffff'; c.stroke();
  if (r >= 7) {
    c.fillStyle = '#fff';
    c.font = `800 ${p.team === 'o' ? r * 1.08 : r * 0.8}px -apple-system,"Helvetica Neue",Arial,sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(p.label, x, y + r * 0.05);
  }
  c.restore();
}

  c.save();
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = r * (lift ? 0.8 : 0.4); c.shadowOffsetY = r * 0.15;
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  const g = c.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
  g.addColorStop(0, '#fdba74'); g.addColorStop(1, '#ea580c');
  c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = Math.max(0.8, r * 0.12); c.strokeStyle = '#6b2509'; c.stroke();
  if (r >= 5) {
    c.lineWidth = Math.max(0.7, r * 0.09);
    c.beginPath(); c.moveTo(x - r, y); c.lineTo(x + r, y); c.stroke();
    c.beginPath(); c.ellipse(x, y, r * 0.42, r, 0, 0, TAU); c.stroke();
  }
  c.restore();
}
function drawPieces(c, v, st, r, lifted) {
  const order = st.pieces.filter(p => p.team === 'o').concat(st.showDef ? st.pieces.filter(p => p.team === 'd') : []);
  for (const p of order) {
    const [sx, sy] = toS(v, p.x, p.y);
    const lift = lifted && lifted.has(p.id);
    if (lifted && SEL.id === p.id) { // 選択中：黄色く光るリング
      c.save(); c.shadowColor = '#facc15'; c.shadowBlur = r * 0.9;
      c.beginPath(); c.arc(sx, sy, r * 1.42, 0, TAU); c.lineWidth = Math.max(3, r * 0.2); c.strokeStyle = '#facc15'; c.stroke(); c.restore();
    }

/* =====================================================================
   レイアウト・レンダリング
   ===================================================================== */
let renderQueued = false;
function requestRender() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(render); } }

function layout() {
  const r = wrap.getBoundingClientRect();
  cssW = Math.max(100, Math.floor(r.width)); cssH = Math.max(100, Math.floor(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  view = computeView(S.court, cssW, cssH, 10);
  R = clamp(view.s * 0.6, 18, 30);
  courtCache.width = canvas.width; courtCache.height = canvas.height;
  drawCourt(courtCache.getContext('2d'), view, cssW, cssH, settings.theme, dpr, false);
  if (T3.renderer) resize3D();
  requestRender();
}

function render() {
  renderQueued = false;
  if (!view) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(courtCache, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = R / 24;
  for (const d of S.drawings) drawStroke(ctx, view, d, k);
  const lifted = new Set();
  for (const a of active.values()) {
    if (a.kind === 'draw') drawStroke(ctx, view, a.d, k);
    else if (a.kind === 'piece') lifted.add(a.id);
    else if (a.kind === 'ball') lifted.add('BALL');
  }
  drawPieces(ctx, view, S, R, lifted);
  if (T3.active && T3.renderer) update3D();
}

function renderThumb(cv, board, w = 104, h = 74) {
  const td = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * td; cv.height = h * td;
  const c = cv.getContext('2d');
  const v = computeView(board.court === 'full' ? 'full' : 'half', w, h, 2);
  drawCourt(c, v, w, h, settings.theme, td, true);
  c.setTransform(td, 0, 0, td, 0, 0);
  for (const d of board.drawings) drawStroke(c, v, d, 0.3);
  drawPieces(c, v, board, Math.max(2.6, v.s * 0.62), null);
}

/* =====================================================================
   変更・履歴・保存
   ===================================================================== */
function snapshot() { return JSON.stringify({ pieces: S.pieces, ball: S.ball, drawings: S.drawings, showDef: S.showDef, court: S.court, playId: S.playId, clipId: S.clipId || null, steps: S.steps || [] }); }
function pushHistory(snap) { history.push(snap || snapshot()); if (history.length > 80) history.shift(); updateUndo(); }
let saveTimer = null;
function saveCurrentSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveCurrentNow, 250); }
function saveCurrentNow() { clearTimeout(saveTimer); lsSet(LS_CUR, Object.assign(boardOf(S), { playId: S.playId || null, clipId: S.clipId || null })); }
function saveSettings() { lsSet(LS_SET, settings); }
function savePlays() { return lsSet(LS_PLAYS, plays); }

function commit() {
  if (!view || view.court !== S.court) layout(); else requestRender();
  saveCurrentSoon();
  updateCourtSeg(); updateDefBtn(); updateUndo(); updateCurPlay(); renderSteps();
  if (!PB.playing) { RT.active = false; RT.faces = {}; RT.screens = new Set(); }
}
function undo() {
  if (!history.length) { toast('これ以上戻れません'); return; }
  const s = JSON.parse(history.pop());
  Object.assign(S, { clipId: null, steps: [] }, s); pbStop();
  active.clear();
  commit(); renderList(); renderClips();
}

/* =====================================================================
   ヒットテスト
   ===================================================================== */
function hitPiece(sx, sy, extra) {
  let best = null, bd = Infinity;
  for (const p of S.pieces) {
    if (p.team === 'd' && !S.showDef) continue;
    const [px, py] = toS(view, p.x, p.y);
    const d = Math.hypot(sx - px, sy - py);
    if (d <= R + extra && d < bd) { bd = d; best = p; }
  }
  return best;
}
function hitTest(sx, sy) {
  const bp = ballScreen(view, S, R);
  if (bp && Math.hypot(sx - bp[0], sy - bp[1]) <= R * 0.52 + 7) return { kind: 'ball', bp };
  const p = hitPiece(sx, sy, 12);
  return p ? { kind: 'piece', p } : null;
}

  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;

  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

  for (let i = S.drawings.length - 1; i >= 0; i--) {
    const d = S.drawings[i];
    let pts = d.pts.map(p => toS(view, p[0], p[1]));
    if (d.type === 'pass') pts = [pts[0], pts[pts.length - 1]];
    for (let j = 1; j < pts.length; j++) {
      if (distSeg(sx, sy, pts[j - 1][0], pts[j - 1][1], pts[j][0], pts[j][1]) < 16) return i;
    }
  }

}

/* =====================================================================
   ポインター操作（指・Apple Pencil・マウス）
   ===================================================================== */
function evPos(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

    else if (e.pointerType === 'touch') { if (t !== 'erase') t = 'move'; }
  }

}

  const i = hitDrawing(sx, sy);
  if (i >= 0) {
    if (!a.pushed) { pushHistory(); a.pushed = true; }
    S.drawings.splice(i, 1); commit();
  }
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (app.classList.contains('pb-open')) app.classList.remove('pb-open');
  if (e.pointerType === 'pen' && !settings.pencil && !settings.pencilAsked) {
    settings.pencil = true; settings.pencilAsked = true; saveSettings(); updatePencilBtn(); updateTools();
    toast('Apple Pencilを検出：ペン＝線を描く／指＝駒を動かす');
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const [sx, sy] = evPos(e);
  const tool = effectiveTool(e);

  if (tool === 'move') {
    const hit = hitTest(sx, sy);
    if (!hit) { active.set(e.pointerId, { kind: 'courtTap', sx, sy, moved: false }); return; }
    pbPause();
    for (const a of active.values()) {
      if ((hit.kind === 'ball' && a.kind === 'ball') || (hit.kind === 'piece' && a.kind === 'piece' && a.id === hit.p.id)) return;
    }
    const snap = snapshot();
    if (hit.kind === 'ball') {
      active.set(e.pointerId, { kind: 'ball', offX: sx - hit.bp[0], offY: sy - hit.bp[1], sx, sy, snap, moved: false });
    } else {
      const [px, py] = toS(view, hit.p.x, hit.p.y);
      active.set(e.pointerId, { kind: 'piece', id: hit.p.id, offX: sx - px, offY: sy - py, sx, sy, snap, moved: false });
    }
    requestRender();
    return;
  }
  if (tool === 'erase') {
    const a = { kind: 'erase', pushed: false };
    active.set(e.pointerId, a);
    eraseAt(sx, sy, a);
    return;
  }
  // 線ツール：駒の上から描き始めたら駒の中心を始点にする
  let [cx, cy] = toC(view, sx, sy);
  const hp = hitPiece(sx, sy, 4);
  if (hp) { cx = hp.x; cy = hp.y; }
  const d = { type: tool, color: settings.color, pts: [[r2(cx), r2(cy)]] };
  active.set(e.pointerId, { kind: 'draw', d, ls: [sx, sy], len: 0 });
  requestRender();
});

canvas.addEventListener('pointermove', e => {
  const a = active.get(e.pointerId);
  if (!a) return;
  e.preventDefault();
  if (a.kind === 'draw') {
    let evs = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (const ev of evs) {
      const [sx, sy] = evPos(ev);
      const dd = Math.hypot(sx - a.ls[0], sy - a.ls[1]);
      if (dd >= 4) {
        a.len += dd; a.ls = [sx, sy];
        const [cx, cy] = toC(view, sx, sy);
        a.d.pts.push([r2(cx), r2(cy)]);
      }
    }
    requestRender(); return;
  }
  const [sx, sy] = evPos(e);
  if (a.kind === 'courtTap') { if (Math.hypot(sx - a.sx, sy - a.sy) > 10) a.moved = true; return; }
  if (a.kind === 'erase') { eraseAt(sx, sy, a); return; }
  if (!a.moved) {
    if (Math.hypot(sx - a.sx, sy - a.sy) < 3) return;
    a.moved = true; pushHistory(a.snap);
  }
  const [cx, cy] = toC(view, sx - a.offX, sy - a.offY);
  const [x, y] = clampC(view, cx, cy);
  if (a.kind === 'piece') {
    const p = S.pieces.find(q => q.id === a.id); p.x = x; p.y = y;
  } else {
    S.ball.holder = null; S.ball.x = x; S.ball.y = y;
  }
  requestRender();
});

function endPointer(e, cancelled) {
  const a = active.get(e.pointerId);
  if (!a) return;
  active.delete(e.pointerId);
  if (a.kind === 'draw') {
    if (!cancelled && a.d.pts.length >= 2 && a.len >= 14) {
      pushHistory(); assignDrawing(a.d); S.drawings.push(a.d);
      if (LINE_TOOLS.includes(a.d.type)) settings.lastLine = a.d.type;
      commit();
    } else requestRender();
    return;
  }
  if (a.kind === 'erase') return;
  if (a.kind === 'courtTap') {
    if (!cancelled && !a.moved) {
      if (SEL.id) { const [cx, cy] = toC(view, a.sx, a.sy); faceToward(SEL.id, cx, cy); }
    }
    return;
  }
  if (a.kind === 'piece' && !a.moved && !cancelled) { handlePieceTap(a.id); requestRender(); return; }
  if (a.kind === 'ball' && a.moved) {
    // 選手の近くで離したらボールを持たせる
    const bp = ballScreen(view, S, R);
    let best = null, bd = Infinity;
    for (const p of S.pieces) {
      if (p.team !== 'o') continue;
      const [px, py] = toS(view, p.x, p.y);
      const d = Math.hypot(bp[0] - px, bp[1] - py);
      if (d < R * 1.7 && d < bd) { bd = d; best = p; }
    }
    if (best) S.ball.holder = best.id;
  }
  if (a.moved) { commit(); recordStep(); } else requestRender();
}
canvas.addEventListener('pointerup', e => endPointer(e, false));
canvas.addEventListener('pointercancel', e => endPointer(e, true));
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

/* =====================================================================
   盤面コマンド
   ===================================================================== */
function setCourt(c) {
  if (S.court === c) return;
  S.court = c; commit();
  if (T3.active && T3.renderer && (T3.cam === 'overview' || T3.cam === 'top')) setCam(T3.cam);
}
function applyPreset(kind) {
  pushHistory();
  const pos = presetPositions(kind, S.pieces);
  pos.forEach((p, i) => { const d = S.pieces.find(q => q.id === 'D' + (i + 1)); d.x = p[0]; d.y = p[1]; });
  S.showDef = true;
  if (kind === 'press' || kind === 'press221') S.court = 'full';
  commit(); recordStep();
  toast(`守備：${PRESET_NAMES[kind]}に配置`);
}
function toggleDef() { pushHistory(); S.showDef = !S.showDef; commit(); }
function clearDrawings() {
  if (!S.drawings.length) { toast('消す線がありません'); return; }
  pushHistory(); S.drawings = []; commit(); toast('線を全消去しました（↶で取り消し）');
}
function resetBoard() {
  pushHistory();
  const b = defaultBoard(S.court);
  Object.assign(S, b, { playId: null, clipId: null, steps: [] }); pbStop(true);
  commit(); renderList(); renderClips(); toast('初期配置に戻しました（↶で取り消し）');
}

/* =====================================================================
   プレー（ストック）
   ===================================================================== */
function getPlay(id) { return plays.find(p => p.id === id); }
function loadPlay(id) {
  const p = getPlay(id); if (!p || !validBoard(p.board)) return;
  pushHistory();
  Object.assign(S, { steps: [] }, clone(p.board), { playId: p.id, clipId: null }); pbStop(true); REC.on = false; SEL.id = null; PB.prefer = null; PB.mode = 'steps';
  if (S.steps.length > 1) toast(`「${p.title}」：▶ でプレーを自動再生できます（${S.steps.length}ステップ）`);
  active.clear();
  app.classList.remove('pb-open');
  commit(); renderList(); renderClips();
}
function overwritePlay(id) {
  const p = getPlay(id); if (!p) return;
  p.board = boardOf(S); p.updatedAt = Date.now();
  if (savePlays()) toast(`「${p.title}」を上書き保存しました`);
  renderList(); renderTabs();
}
function deletePlay(id) {
  const i = plays.findIndex(p => p.id === id); if (i < 0) return;
  const t = plays[i].title;
  plays.splice(i, 1); savePlays();
  if (S.playId === id) { S.playId = null; saveCurrentSoon(); }
  renderTabs(); renderList(); updateCurPlay(); toast(`「${t}」を削除しました`);
}
function duplicatePlay(id) {
  const p = getPlay(id); if (!p) return;
  const n = clone(p); n.id = uid(); n.title = p.title + '（コピー）'; n.createdAt = n.updatedAt = Date.now();
  plays.splice(plays.indexOf(p) + 1, 0, n); savePlays();
  renderTabs(); renderList(); toast('複製しました');
}
function movePlay(id, dir) {
  const p = getPlay(id); if (!p) return;
  const same = plays.filter(q => q.cat === p.cat);
  const i = same.indexOf(p), j = i + dir;
  if (j < 0 || j >= same.length) return;
  const a = plays.indexOf(p), b = plays.indexOf(same[j]);
  [plays[a], plays[b]] = [plays[b], plays[a]];
  savePlays(); renderList();
}

function renderTabs() {
  const el = $('#catTabs');
  el.innerHTML = CATS.map(c => {
    const n = plays.filter(p => p.cat === c.id).length;
    return `<button class="cat ${settings.cat === c.id ? 'active' : ''}" data-cat="${c.id}" style="--c:${c.color}">
      <b>${c.short}</b><span>${c.name}</span><em class="cnt">${n}</em></button>`;
  }).join('');
}
function renderList() {
  renderQuick();
  const el = $('#playList');
  const cat = catById(settings.cat);
  $('#listTitle').textContent = `${cat.name}（${plays.filter(p => p.cat === cat.id).length}）`;
  const items = plays.filter(p => p.cat === settings.cat);
  if (!items.length) {
    el.innerHTML = `<div class="empty">このカテゴリーにはまだプレーがありません。<br>盤面を作って<b>「＋ 保存」</b>でストックできます。</div>`;
    return;
  }
  el.innerHTML = items.map(p => `
    <div class="play-item ${S.playId === p.id ? 'loaded' : ''}" data-id="${esc(p.id)}" role="button">
      <canvas class="thumb"></canvas>
      <div class="pi-body"><div class="pi-title">${p.board && p.board.steps && p.board.steps.length > 1 ? '<span class="st-badge">▶' + p.board.steps.length + '</span>' : ''}${esc(p.title)}</div><div class="pi-memo">${esc(p.memo || '')}</div></div>
      <button class="pi-more" data-more="${esc(p.id)}" aria-label="メニュー">⋯</button>
    </div>`).join('');
  el.querySelectorAll('.play-item').forEach(it => {
    const p = getPlay(it.dataset.id);
    if (p && validBoard(p.board)) renderThumb(it.querySelector('canvas'), p.board);
  });
}
function renderTools() {
  $('#toolBtns').innerHTML = TOOLS.map(t => `<button class="tool" data-tool="${t.id}">${t.icon}${t.name}</button>`).join('');
  updateTools();
}
function updateTools() {
  document.querySelectorAll('.tool[data-tool]').forEach(b => {
    b.classList.toggle('on', b.dataset.tool === settings.tool);
    b.classList.toggle('penline', settings.pencil && settings.tool === 'move' && b.dataset.tool === settings.lastLine);
  });
  const cd = $('#colorDot'); if (cd) cd.style.background = settings.color;
}
function updateCourtSeg() { document.querySelectorAll('#courtSeg button').forEach(b => b.classList.toggle('on', b.dataset.court === S.court)); }
function updateDefBtn() {
  const b = $('#btnDef');
  b.classList.toggle('off', !S.showDef);
  b.innerHTML = S.showDef ? '守備 表示<small>タップで隠す</small>' : '守備 なし<small>タップで出す</small>';
}
function updateUndo() { $('#btnUndo').disabled = history.length === 0; }
function updateCurPlay() {
  const el = $('#curPlay');
  const p = S.playId ? getPlay(S.playId) : null;
  const cl = !p && S.clipId ? getClip(S.clipId) : null;
  if (cl) {
    el.innerHTML = `<span class="badge" style="--c:#4ade80">CLIP</span><span class="t">${esc(cl.title)}</span><span class="m">${esc(cl.memo || '')}</span>`;
    $('#btnOverwrite').hidden = false;
    return;
  }
  if (p) {
    const c = catById(p.cat);
    el.innerHTML = `<span class="badge" style="--c:${c.color}">${c.short}</span><span class="t">${esc(p.title)}</span><span class="m">${esc(p.memo || '')}</span>`;
  } else {
    el.innerHTML = `<span class="free">フリーボード ― 駒を動かして線を描き、「＋ 保存」でストック</span>`;
  }
  $('#btnOverwrite').hidden = !p;
}
function updateThemeBtn() {}
function updatePencilBtn() {}
function updateSidebar() { app.classList.toggle('sb-off', !settings.sidebar); }

$('#fileInput').addEventListener('change', e => {

    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.plays) ? data.plays : null);
    const list = arr ? normalizeImported(arr) : [];
    const hasClips = !!(data && Array.isArray(data.clips));

    const vlist = data && Array.isArray(data.videos) ? normalizeVideos(data.videos) : [];

      });
    });
  };

});

/* =====================================================================
   MTG分析モード：YouTube＋クリップ
   ===================================================================== */
const r1 = v => Math.round(v * 10) / 10;
function fmt(t) {
  if (t == null || !isFinite(t)) return '--:--';
  t = Math.max(0, t);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const ss = s.toFixed(1).padStart(4, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}
function parseTime(str) {
  const s = String(str || '').trim(); if (!s) return null;
  const parts = s.split(':').map(Number);
  if (parts.some(n => !isFinite(n))) return null;
  let t = 0; for (const p of parts) t = t * 60 + p;
  return r1(t);
}
function parseYT(input) {
  const s = String(input || '').trim(); if (!s) return null;
  if (/^[\w-]{11}$/.test(s)) return { id: s, start: 0 };
  let u; try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch (_) { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, '');
  let id = null;
  if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
  else if (/(^|\.)youtube(-nocookie)?\.com$/.test(host)) {
    id = u.searchParams.get('v');
    if (!id) { const m = u.pathname.match(/\/(?:embed|shorts|live|v)\/([\w-]{11})/); if (m) id = m[1]; }
  }
  if (!id || !/^[\w-]{11}$/.test(id)) return null;
  let start = 0;
  const t = u.searchParams.get('t') || u.searchParams.get('start');
  if (t) { const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if (m) start = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0); }
  return { id, start };
}
function saveV() { lsSet(LS_VID, V); }
function saveClips() { return lsSet(LS_CLIPS, clips); }
function getClip(id) { return clips.find(c => c.id === id); }
function getVideo(id) { return V.videos.find(v => v.id === id); }
function videoLabel(id) { const v = getVideo(id); return (v && v.title) || ('動画 ' + id); }

const VID_RE = /^([\w-]{11}|local:.{1,100})$/;
function normalizeClips(arr) {
  return arr.filter(c => c && VID_RE.test(c.videoId) && isFinite(c.in) && isFinite(c.out) && +c.out > +c.in).map(c => ({
    id: String(c.id || uid()),
    videoId: c.videoId,
    title: String(c.title || '無題のクリップ').slice(0, 60),
    tags: Array.isArray(c.tags) ? c.tags.map(String).filter(Boolean).slice(0, 12) : [],
    memo: String(c.memo || '').slice(0, 1000),
    in: r1(+c.in), out: r1(+c.out),
    board: validBoard(c.board) ? boardOf(Object.assign({}, c.board)) : null,
    keys: normalizeKeys(c.keys),
    playId: typeof c.playId === 'string' ? c.playId : null,
    createdAt: +c.createdAt || Date.now(), updatedAt: +c.updatedAt || Date.now(),
  }));
}
function normalizeVideos(arr) {
  return arr.filter(v => v && VID_RE.test(v.id)).map(v => ({
    id: v.id, url: v.id.startsWith('local:') ? '' : String(v.url || 'https://youtu.be/' + v.id), title: String(v.title || '').slice(0, 120), addedAt: +v.addedAt || Date.now(),
    local: v.id.startsWith('local:') || undefined,
  }));
}
function afterDataChange() { renderTabs(); renderList(); renderClips(); updateCurPlay(); }

/* ---------- YouTube IFrame Player API ---------- */
let ytPromise = null, player = null, playerReady = false, playerVideo = null, pendingOpen = null;
let activeClipId = null, guardUntil = 0;

function ensureYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytPromise) return ytPromise;
  ytPromise = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') prev(); res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => { ytPromise = null; s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytPromise = null; rej(new Error('timeout')); } }, 15000);
  });
  return ytPromise;
}
function setEmpty(html) { const el = $('#vEmpty'); if (html) { el.innerHTML = html; el.style.display = 'flex'; } else el.style.display = 'none'; }

async function openVideo(id, start = 0, autoplay = false) {
  if (player && player.isLocal) deactivateLocal();
  playerVideo = id;
  if (!player) setEmpty('<b>読み込み中…</b>');
  try { await ensureYT(); }
  catch (e) {
    // 原因を切り分けて表示する
    let why;
    if (!navigator.onLine) why = 'iPadがインターネットにつながっていません。Wi-Fiまたはモバイル通信を確認してください。';
    else if (location.protocol === 'file:' || location.protocol === 'blob:' || location.origin === 'null')
      why = 'このページが<b>ファイルとして直接開かれている</b>か、<b>プレビュー画面</b>の中で開かれています。この状態ではYouTubeの部品を読み込めません。<br>https:// で始まるURL（チームのWebページ等）に置いて、Safariで開いてください。';
    else if (e && e.message === 'load')
      why = 'YouTubeへの通信が<b>ブロック</b>されています。<br>・学校／施設のWi-Fiのフィルタ（YouTube制限）<br>・Safariのコンテンツブロッカー（設定 › Safari › 機能拡張）<br>のどちらかが原因のことが多いです。モバイル通信（テザリング）で試すと切り分けられます。';
    else why = 'YouTubeの部品の読み込みが<b>時間切れ</b>になりました。通信が遅いか、途中でブロックされています（学校Wi-Fiのフィルタなど）。';
    setEmpty(`<b>YouTubeに接続できません</b><span style="font-size:13px;line-height:1.7;text-align:left;max-width:440px">${why}</span>
      <button class="btn primary" id="vRetry" style="margin-top:8px;height:44px">↻ もう一度試す</button>
      <span style="font-size:12px">（作戦盤・クリップの編集はオフラインでも使えます）</span>`);
    const rb = $('#vRetry'); if (rb) rb.addEventListener('click', () => openVideo(id, start, autoplay));
    toast('⚠ YouTubeに接続できません'); return false;
  }
  if (!player) {
    playerReady = false;
    const vars = { playsinline: 1, rel: 0, modestbranding: 1, start: Math.floor(start) };
    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    player = new YT.Player('ytPlayer', {
      videoId: id, playerVars: vars,
      events: {
        onReady: () => {
          playerReady = true; setEmpty(null);
          try { player.setPlaybackRate(V.rate); } catch (_) {}
          if (pendingOpen && pendingOpen.id !== id) { const p = pendingOpen; pendingOpen = null; openVideo(p.id, p.start, p.autoplay); }
          else { pendingOpen = null; if (start) player.seekTo(start, true); if (autoplay) player.playVideo(); }
          updateRateUI();
        },
        onStateChange: onYTState,
        onError: onYTError,
        onPlaybackRateChange: e => { V.rate = e.data; saveV(); updateRateUI(); },
      },
    });
  } else if (playerReady) {
    setEmpty(null);
    if (autoplay) player.loadVideoById({ videoId: id, startSeconds: start });
    else player.cueVideoById({ videoId: id, startSeconds: start });
    setTimeout(() => { try { player.setPlaybackRate(V.rate); } catch (_) {} }, 600);
  } else {
    pendingOpen = { id, start, autoplay };
  }
  return true;
}
function onYTState(e) {
  const st = e.data;
  $('#vPlay').textContent = st === 1 ? '❚❚' : '▶';
  if (st === 1 || st === 5 || st === 2) {
    try {
      const d = player.getVideoData();
      const v = d && getVideo(d.video_id || playerVideo);
      if (v && d.title && v.title !== d.title) { v.title = d.title; saveV(); renderClips(); }
    } catch (_) {}
  }
  if (st === 0) { // ENDED
    const c = activeClipId && getClip(activeClipId);
    if (c && V.loop) { guardUntil = Date.now() + 1200; player.seekTo(c.in, true); player.playVideo(); }
  }
}
function onYTError(e) {
