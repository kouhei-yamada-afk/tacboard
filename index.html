    if (t > 0.05) { try { nxt.currentTime = Math.max(0, Math.min(t, dur - 0.05)); } catch (_) {} }
    if (autoplay) nxt.play().then(swap).catch(swap);
    else { nxt.pause(); if (t > 0.05) nxt.addEventListener('seeked', swap, { once: true }); else swap(); }
  }, { once: true });
  nxt.src = seg.url; nxt.load();
}
const shownVideo = () => document.querySelector('.lv-main.show');
function togglePause() {
  if (!L.stream || L.waiting) return;
  L.paused = !L.paused;
  if (L.paused) { const v = shownVideo(); if (v) v.pause(); }
  else {
    // 再開：最新の区間を「ちょうど遅延秒数前」の位置から再生し直す
    const last = L.queue[L.queue.length - 1];
    if (last) loadSeg(last, (performance.now() - last.readyAt) / 1000, true);
  }
  updateLiveUI();
}
function stepFrozen(d) {
  if (!L.paused) return;
  const v = shownVideo(); if (!v || !L.cur) return;
  const dur = isFinite(v.duration) ? v.duration : L.cur.dur;
  const t = v.currentTime + d;
  const i = L.queue.indexOf(L.cur);
  if (t < 0 && i > 0) { const prev = L.queue[i - 1]; loadSeg(prev, prev.dur + t, false); return; }
  if (t > dur && i >= 0 && i < L.queue.length - 1) { loadSeg(L.queue[i + 1], t - dur, false); return; }
  v.currentTime = clamp(t, 0, Math.max(0, dur - 0.05));
}
function liveStop() {
  L.gen++; clearTimeout(L.segTimer);
  if (L.rec && L.rec.state !== 'inactive') { try { L.rec.stop(); } catch (_) {} }
  L.rec = null; stopTracks();
  $('#lvPip').srcObject = null;
  resetPlayers(); L.paused = false; L.waiting = false;
  if (L.wake) { L.wake.release().catch(() => {}); L.wake = null; }
  lvMsg('<big>カメラ停止中</big><small>「● カメラ開始」を押すと、指定秒数遅れの映像を表示します</small>');
  updateLiveUI();
}
async function requestWake() { try { if (navigator.wakeLock) L.wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
function applyMirror() { ['#lvA', '#lvB', '#lvPip'].forEach(s => $(s).classList.toggle('mirror', L.mirror)); }
function setDelay(d) {
  L.delay = d; settings.liveDelay = d; saveSettings(); updateLiveUI();
  if (L.stream) { startCycle(); toast(`遅延を${d}秒に変更しました`); }
}
function updateLiveUI() {
  const on = !!L.stream;
  const s = $('#lvStart'); s.textContent = on ? '■ カメラ停止' : '● カメラ開始'; s.classList.toggle('primary', !on); s.classList.toggle('danger', on);
  document.querySelectorAll('#lvDelay button').forEach(b => b.classList.toggle('on', +b.dataset.d === L.delay));
  $('#lvMirror').classList.toggle('on', L.mirror);
  $('#lvPipBtn').classList.toggle('on', L.pip); $('#lvPip').classList.toggle('hide', !L.pip || !on);
  const p = $('#lvPause');
  p.disabled = !on || L.waiting;
  p.classList.toggle('paused', L.paused);
  p.textContent = L.paused ? '▶ 再開（ディレイ再生に戻る）' : '❚❚ 一時停止（フリーズ）';
  $('#lvBack').disabled = $('#lvFwd').disabled = !L.paused;
  $('#lvFreeze').classList.toggle('show', L.paused);
}
// カウントダウン・状態表示
setInterval(() => {
  if (settings.mode !== 'live' || !L.stream) { $('#lvBadge').textContent = ''; return; }
  const badge = $('#lvBadge');
  badge.classList.toggle('paused', L.paused);
  badge.textContent = L.paused ? '❚❚ フリーズ中' : (L.waiting ? '● 録画中' : `● ${L.delay}秒遅れ`);
  if (L.waiting) {
    const el = (performance.now() - L.t0) / 1000, r = Math.max(0, L.delay - el);
    lvMsg(`<small>ディレイ再生開始まで</small><b>${Math.ceil(r)}</b><big>秒</big>
      <div class="lv-bar"><i style="width:${clamp(el / L.delay * 100, 0, 100)}%"></i></div>
      <small style="margin-top:10px">カメラはもう録っています。プレーを始めてください</small>`);
  }
}, 100);

$('#lvStart').addEventListener('click', () => { if (L.stream) liveStop(); else liveStart(); });
$('#lvFlip').addEventListener('click', async () => {
  L.facing = L.facing === 'environment' ? 'user' : 'environment';
  L.mirror = L.facing === 'user';
  toast(L.facing === 'user' ? '前面カメラに切替（左右反転ON）' : '背面カメラに切替');
  if (L.stream) { liveStop(); await liveStart(); } else updateLiveUI();
});
$('#lvMirror').addEventListener('click', () => { L.mirror = !L.mirror; applyMirror(); updateLiveUI(); });
$('#lvPipBtn').addEventListener('click', () => { L.pip = !L.pip; updateLiveUI(); });
$('#lvDelay').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) setDelay(+b.dataset.d); });
$('#lvPause').addEventListener('click', togglePause);
$('#lvStage').addEventListener('click', e => { if (!e.target.closest('.lv-pip')) togglePause(); });
$('#lvBack').addEventListener('click', () => stepFrozen(-0.5));
$('#lvFwd').addEventListener('click', () => stepFrozen(0.5));
document.addEventListener('visibilitychange', () => {
  if (settings.mode !== 'live') return;
  if (document.hidden) { if (L.stream) { L.resumeOnShow = true; liveStop(); } }
  else if (L.resumeOnShow) { L.resumeOnShow = false; liveStart(); }
});

/* =====================================================================
   イベント登録
   ===================================================================== */
$('#catTabs').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  settings.cat = b.dataset.cat; saveSettings(); renderTabs(); renderList();
  $('#playList').scrollTop = 0;
});
$('#playList').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { openActions(more.dataset.more); return; }
  const it = e.target.closest('.play-item');
  if (it) loadPlay(it.dataset.id);
});
$('#toolBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-tool]'); if (!b) return;
  if (T3.active) { setView3D(false); toast('2D平面に戻りました（線の描画・駒の移動は2Dで）'); }
  settings.tool = b.dataset.tool;
  if (LINE_TOOLS.includes(settings.tool)) settings.lastLine = settings.tool;
  saveSettings(); updateTools();
});
$('#swatches').addEventListener('click', e => {
  const b = e.target.closest('[data-color]'); if (!b) return;
  settings.color = b.dataset.color;
  if (settings.tool === 'move' || settings.tool === 'erase') { if (!settings.pencil) settings.tool = settings.lastLine; }
  saveSettings(); updateTools();
});
$('#courtSeg').addEventListener('click', e => { const b = e.target.closest('[data-court]'); if (b) setCourt(b.dataset.court); });
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
$('#btnDef').addEventListener('click', toggleDef);
$('#btnUndo').addEventListener('click', undo);
$('#btnClear').addEventListener('click', clearDrawings);
$('#btnReset').addEventListener('click', resetBoard);
$('#btnSaveNew').addEventListener('click', openSaveNew);
$('#btnSaveTop').addEventListener('click', openSaveNew);
$('#btnOverwrite').addEventListener('click', () => {
  const cl = !S.playId && S.clipId && getClip(S.clipId);
  if (cl) return confirmBox(`クリップ「${esc(cl.title)}」に紐づく盤面を、現在の盤面で更新しますか？`, '更新', () => updateClipBoard(cl.id));
  const p = S.playId && getPlay(S.playId); if (!p) return;
  confirmBox(`「${esc(p.title)}」を現在の盤面で上書きしますか？`, '上書き', () => overwritePlay(p.id));
});
$('#curPlay').addEventListener('click', openMemo);
$('#btnSidebar').addEventListener('click', () => {
  if (settings.mode === 'mtg') { app.classList.toggle('pb-open'); return; }
  settings.sidebar = !settings.sidebar; saveSettings(); updateSidebar();
});
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
$('#btnTheme').addEventListener('click', () => {
  settings.theme = settings.theme === 'wood' ? 'white' : 'wood'; saveSettings(); updateThemeBtn(); layout(); renderList();
  if (T3.renderer) updateCourtTexture();
});
$('#btnPencil').addEventListener('click', () => {
  settings.pencil = !settings.pencil; settings.pencilAsked = true; saveSettings(); updatePencilBtn(); updateTools();
  toast(settings.pencil ? 'ペン優先：ペン＝線を描く／指＝駒を動かす' : '指もペンも選択中のツールで操作します');
});
$('#btnExport').addEventListener('click', exportData);
$('#btnImport').addEventListener('click', () => $('#fileInput').click());

document.addEventListener('keydown', e => {
  if (modal.classList.contains('open')) { if (e.key === 'Escape') closeModal(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  // MTG分析モード用キーボード操作（Mac・外付けキーボード）
  if (settings.mode !== 'mtg' || e.target.closest('input,textarea')) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'arrowleft') { e.preventDefault(); skip(-5); }
  else if (k === 'arrowright') { e.preventDefault(); skip(5); }
  else if (k === 'i') markIn();
  else if (k === 'o') markOut();
});

window.addEventListener('pagehide', saveCurrentNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCurrentNow(); });

if ('ResizeObserver' in window) new ResizeObserver(() => layout()).observe(wrap);
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* =====================================================================
   起動
   ===================================================================== */
renderTools(); renderTabs(); renderList();
updateSidebar(); updateThemeBtn(); updatePencilBtn();
updateCourtSeg(); updateDefBtn(); updateUndo(); updateCurPlay();
if (V.cur && getVideo(V.cur)) $('#vUrl').value = getVideo(V.cur).url;
updateInOut(); updateRateUI(); renderClips();
updateViewSeg(); updateLiveUI(); updateFaceBtns();
if (settings.mode === 'live') settings.mode = 'court'; // カメラは操作してから起動する
setMode(settings.mode);
layout();
$('#btnHelp').addEventListener('click', openHelp);
// 起動時に使い方ガイドを自動表示（「次回から自動表示しない」をONにした端末を除く）
if (!guideHidden()) openHelp();
})();
</script>
</body>
</html>
