// 時刻 t における盤面を、前後のキーフレームから線形補間して S に反映
function applyInterp(keys, t) {
  if (!keys.length) return;
  let a = keys[0], b = keys[0], u = 0;
  if (t >= keys[keys.length - 1].t) { a = b = keys[keys.length - 1]; }
  else if (t > keys[0].t) {
    for (let i = 0; i < keys.length - 1; i++) {
      if (t < keys[i + 1].t) { a = keys[i]; b = keys[i + 1]; u = (t - a.t) / ((b.t - a.t) || 1); break; }
    }
  }
  const lerp = (p, q) => p + (q - p) * u;
  for (const p of S.pieces) {
    const pa = a.pieces.find(q => q.id === p.id), pb = b.pieces.find(q => q.id === p.id);
    if (!pa || !pb) continue;
    p.x = r2(lerp(pa.x, pb.x)); p.y = r2(lerp(pa.y, pb.y));
    if (typeof pa.face === 'number' && typeof pb.face === 'number') {
      let d = ((pb.face - pa.face) % 360 + 540) % 360 - 180; p.face = Math.round(pa.face + d * u);
    } else if (typeof (u < 0.5 ? pa : pb).face === 'number') p.face = (u < 0.5 ? pa : pb).face;
    else delete p.face;
  }
  const at = key => {
    if (key.ball.holder) { const h = S.pieces.find(q => q.id === key.ball.holder); if (h) return { x: h.x, y: h.y }; }
    return { x: key.ball.x, y: key.ball.y };
  };
  const ha = a.ball.holder, hb = b.ball.holder;
  if (ha && ha === hb) { S.ball.holder = ha; }
  else if (u < 0.02 && ha) S.ball.holder = ha;
  else if (u > 0.98 && hb) S.ball.holder = hb;
  else { const A = at(a), B = at(b); S.ball.holder = null; S.ball.x = r2(lerp(A.x, B.x)); S.ball.y = r2(lerp(A.y, B.y)); }
  if (S.ball.holder) { const h = S.pieces.find(q => q.id === S.ball.holder); if (h) { S.ball.x = h.x; S.ball.y = h.y; } }
  const sd = u < 0.5 ? a.showDef : b.showDef;
  if (S.showDef !== sd) { S.showDef = sd; updateDefBtn(); }
  requestRender();
  const now = performance.now();
  if (now - SY.savedAt > 1000) { SY.savedAt = now; saveCurrentSoon(); } // 毎フレーム保存しない
}
// 毎フレーム：再生時間を監視して盤面を動かす（通常・スロー・シークすべて対応）
function syncFrame() {
  requestAnimationFrame(syncFrame);
  if (settings.mode !== 'mtg' || !V.sync || !ytOK() || active.size || PB.playing || T3.dragId) return;
  const tg = kfTarget(); if (!tg || !tg.keys.length) return;
  let raw, st = -1;
  try { raw = player.getCurrentTime() || 0; st = player.getPlayerState(); } catch (_) { return; }
  const now = performance.now();
  if (raw !== SY.raw) { SY.raw = raw; SY.base = raw; SY.at = now; }
  let t = raw;
  if (st === 1) t = Math.min(SY.base + (now - SY.at) / 1000 * (V.rate || 1), raw + 0.4); // APIの更新間隔を補って滑らかに
  const hi = tg.out != null ? tg.out + 0.25 : Infinity;
  if (t < tg.in - 0.25 || t > hi) { SY.lastApplied = null; return; }
  if (SY.lastApplied !== null && Math.abs(t - SY.lastApplied) < 0.004) return; // 停止中は手動の駒移動を上書きしない
  SY.lastApplied = t;
  applyInterp(tg.keys, t);

const T3 = { active: false, renderer: null, scene: null, camera: null, controls: null, avatars: {}, ball: null,

  ['https://unpkg.com/three@0.128.0/build/three.min.js', 'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'],

  return new Promise((res, rej) => {

    const to = setTimeout(() => { s.remove(); rej(new Error('timeout')); }, 15000);
    s.onload = () => { clearTimeout(to); res(); };

    document.head.appendChild(s);

async function load3D() {

  for (const [a, b] of THREE_SRC) {
    try {
      if (!window.THREE) await loadScript(a);
      if (!THREE.OrbitControls) await loadScript(b);
      if (window.THREE && THREE.OrbitControls) return;
    } catch (_) {}

}

      for (let j = 1; j < pts.length; j++) { const dd = distSeg(c[0], c[1], pts[j - 1][0], pts[j - 1][1], pts[j][0], pts[j][1]); if (dd < bd) { bd = dd; bi = i; } }

function rebuildDraw3D() {
  const g = T3.drawGroup;
  while (g.children.length) { const c = g.children.pop(); if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); }
  const Y = 0.035, TR = 0.045, UP = new THREE.Vector3(0, 1, 0);

    const D = new THREE.Vector3(dir.x, 0, dir.y).normalize();
    m.position.copy(V3(tip.x, tip.y)).addScaledVector(D, -0.21); m.quaternion.setFromUnitVectors(UP, D); g.add(m);

  if (bc.held === p.id || Math.hypot(bc.x - p.x, bc.y - p.y) < 0.6) { tx = BX; ty = BY; th = 2.2; }
  const dx = tx - p.x, dz = ty - p.y, dist = Math.hypot(dx, dz) || 1;
  T3.yaw = Math.atan2(dz, dx);
  T3.pitch = clamp(Math.atan2(th - EYE_H, dist) - 0.08, -1.2, 1.2);
  T3.posSig = piecesSig();
}
// 選手の目の位置から（頭は非表示、自分の腕・肩口が視界の下端に入る位置）
function applyEye() {
  const a = T3.avatars[T3.eyeId]; if (!a) return;
  const c = T3.camera, ud = a.userData;
  a.updateMatrixWorld(true);
  const hp = ud.J.head.getWorldPosition(new THREE.Vector3());
  const fx = Math.cos(T3.yaw), fz = Math.sin(T3.yaw);
  c.position.set(hp.x - fx * 0.05, hp.y + 0.09, hp.z - fz * 0.05);
  const cp = Math.cos(T3.pitch);
  c.lookAt(c.position.x + fx * cp, c.position.y + Math.sin(T3.pitch), c.position.z + fz * cp);
}
function resize3D() {
  if (!T3.renderer || !cssW || !cssH) return;
  T3.renderer.setSize(cssW, cssH);
  T3.camera.aspect = cssW / cssH; T3.camera.updateProjectionMatrix();
  // 画面の向き・大きさが変わったら、手で動かしていない限りコート全体を収め直す
  if (!T3.userMoved && (T3.cam === 'overview' || T3.cam === 'top')) { fitCamera(T3.cam); T3.controls.update(); }
}
// コートの四隅（エンドライン・サイドライン＋外周の余白、ゴールの高さまで）が必ず1画面に収まる距離を計算
function fitCamera(mode) {
  const c = T3.camera, ctl = T3.controls, half = S.court !== 'full';
  const x0 = half ? 12.8 : -2.6, x1 = 30.6, y0 = -1.8, y1 = 16.8;          // コート座標（m）：外周の余白とゴールの支柱まで
  const target = new THREE.Vector3(wx((x0 + x1) / 2), 0.6, wz((y0 + y1) / 2));
  const pts = [];
  for (const x of [x0, x1]) for (const y of [y0, y1]) for (const h of [0, 4]) pts.push(new THREE.Vector3(wx(x), h, wz(y)));
  // 真上：ほぼ垂直（画面の上＝奥のサイドライン）／全体：ベンチ側の斜め上から
  const dir = mode === 'top' ? new THREE.Vector3(0, 1, 0.012).normalize()
    : (half ? new THREE.Vector3(-0.32, 1.0, 1.12) : new THREE.Vector3(0, 1.0, 1.12)).normalize();
  const fits = d => {
    c.position.copy(target).addScaledVector(dir, d); c.lookAt(target); c.updateMatrixWorld(true);
    return pts.every(p => { const v = p.clone().project(c); return v.z < 1 && Math.abs(v.x) <= 0.9 && Math.abs(v.y) <= 0.86; });
  };
  let lo = 2, hi = 150;
  for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (fits(m)) hi = m; else lo = m; }
  c.position.copy(target).addScaledVector(dir, hi);
  ctl.target.copy(target);
  ctl.maxDistance = Math.max(160, hi * 2.5);
}
function start3DLoop() {

  const step = () => {
    if (!T3.active || settings.mode === 'live' || !T3.renderer) { T3.raf = 0; return; }
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    animatePlayers(dt, now / 1000);

    T3.renderer.render(T3.scene, T3.camera);

}
$('#viewSeg').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView3D(b.dataset.view === '3d'); });

/* =====================================================================
   ライブ遅延（タイムシフト）
   数秒ごとの短い区間に分けて録画 → 端末内の大容量ストレージ（IndexedDB）に順次保存
   → 「今から○秒／○分前」の位置を連続再生。古い区間は自動削除（メモリを圧迫しない）
   ===================================================================== */
const LIVE_SHORT = [3, 5, 10, 30], LIVE_LONG = [300, 900, 1800, 3600, 5400];
const L = { stream: null, facing: 'environment',
  delay: (isFinite(settings.liveDelay) && settings.liveDelay >= 2 && settings.liveDelay <= 10800) ? settings.liveDelay : 5,
  mirror: false, pip: true, gen: 0, rec: null, segTimer: 0, segs: [], seq: 0, bytes: 0, cur: null, pre: null,
  paused: false, follow: true, mime: '', playTok: 0, wake: null, resumeOnShow: false, starting: false,
  seeking: false, recStart: 0, waitNext: false, loading: false, quotaText: '' };
const nowS = () => (performance.timeOrigin + performance.now()) / 1000;
const fmtLag = s => {
  s = Math.max(0, Math.round(s)); if (s < 60) return `${s}秒`;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}時間${m}分` : (x && s < 600 ? `${m}分${x}秒` : `${m}分`);
};
const fmtClock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const segLen = () => (L.delay <= 5 ? 2 : L.delay <= 30 ? 3 : 4);          // 区間の長さ（秒）
const bitrate = () => (L.delay >= 300 ? 1200000 : 2500000);                // 長時間は容量を抑える

/* --- 保存先：IndexedDB（使えない端末ではメモリに直近だけ保持） --- */
const LDB = { db: null, ok: true, mem: new Map() };
function ldbOpen() {
  return new Promise(res => {
    if (LDB.db) return res(LDB.db);
    let rq; try { rq = indexedDB.open('tacboard-live', 1); } catch (_) { LDB.ok = false; return res(null); }
    rq.onupgradeneeded = () => rq.result.createObjectStore('segs', { keyPath: 'id' });
    rq.onsuccess = () => { LDB.db = rq.result; res(LDB.db); };
    rq.onerror = () => { LDB.ok = false; res(null); };
  });
}
const ldbStore = mode => LDB.db.transaction('segs', mode).objectStore('segs');
async function ldbPut(seg, blob) {
  LDB.mem.set(seg.id, blob);
  if (LDB.db && LDB.ok) {
    try {
      await new Promise((res, rej) => { const r = ldbStore('readwrite').put({ id: seg.id, blob }); r.onsuccess = res; r.onerror = () => rej(r.error); });
      seg.inDb = true;
    } catch (_) { LDB.ok = false; toast('⚠ 端末の空き容量が足りません。長時間の遅延は直近の分だけになります'); }
  }
  // メモリには新しい数区間だけ残す（保存済みのものは解放）
  const keep = new Set(L.segs.slice(-6).map(s => s.id)); if (L.cur) keep.add(L.cur.id); if (L.pre) keep.add(L.pre.seg.id);
  for (const s of L.segs) if (s.inDb && !keep.has(s.id)) LDB.mem.delete(s.id);
}
async function ldbGet(id) {
  if (LDB.mem.has(id)) return LDB.mem.get(id);
  if (!LDB.db) return null;
  return new Promise(res => { try { const r = ldbStore('readonly').get(id); r.onsuccess = () => res(r.result ? r.result.blob : null); r.onerror = () => res(null); } catch (_) { res(null); } });
}
function ldbDel(id) { LDB.mem.delete(id); if (LDB.db) { try { ldbStore('readwrite').delete(id); } catch (_) {} } }
function ldbClear() { LDB.mem.clear(); if (LDB.db) { try { ldbStore('readwrite').clear(); } catch (_) {} } }
ldbOpen().then(() => ldbClear()); // 前回ページを開いたときの録画は使わないので起動時に片付ける

async function updateQuota() {
  try {
    if (!navigator.storage || !navigator.storage.estimate) return;
    const e = await navigator.storage.estimate();
    const free = (e.quota || 0) - (e.usage || 0);
    L.quotaText = free > 0 ? `空き ${free > 1e9 ? (free / 1e9).toFixed(1) + 'GB' : Math.round(free / 1e6) + 'MB'}` : '';
    return free;
  } catch (_) { return null; }
}

/* --- 録画 --- */
function pickMime() {
  const c = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const m of c) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (_) {} }
  return '';
}
function lvMsg(html) { const el = $('#lvCount'); if (html) { el.innerHTML = html; el.classList.add('show'); } else el.classList.remove('show'); }
async function liveStart() {
  if (L.stream || L.starting) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    lvMsg('<big>カメラを使えません</big><small>このページを https:// のURLで開いてください<br>（ファイルを直接開いた状態ではカメラが許可されません）</small>'); return;
  }
  if (typeof MediaRecorder === 'undefined') { lvMsg('<big>録画機能に未対応のブラウザです</big><small>iPadOS 14.5以降のSafariでお試しください</small>'); return; }
  L.starting = true; lvMsg('<big>カメラを起動中…</big>');
  try {
    L.stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: L.facing }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 } } });
  } catch (e) {
    L.starting = false;
    lvMsg('<big>カメラの使用が許可されませんでした</big><small>Safariのカメラ許可を「許可」にしてから「● カメラ開始」を押してください</small>');

  }
  L.starting = false;
  if (settings.mode !== 'live') { stopTracks(); return; }
  await ldbOpen();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  const pip = $('#lvPip'); pip.srcObject = L.stream; pip.play().catch(() => {});
  if (!L.segs.length) L.recStart = nowS();
  L.mime = pickMime(); L.gen++; L.follow = true; L.paused = false;
  newSegment(L.gen);
  applyMirror(); requestWake(); updateQuota(); updateLiveUI();

}
function stopTracks() { if (L.stream) { L.stream.getTracks().forEach(t => t.stop()); L.stream = null; } }
function newSegment(gen) {
  if (gen !== L.gen || !L.stream) return;
  const opt = { videoBitsPerSecond: bitrate() }; if (L.mime) opt.mimeType = L.mime;
  let rec;
  try { rec = new MediaRecorder(L.stream, opt); } catch (_) { try { rec = new MediaRecorder(L.stream); } catch (e) { lvMsg('<big>録画を開始できません</big>'); return; } }

  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    if (!chunks.length) return;
    const end = nowS(), blob = new Blob(chunks, { type: rec.mimeType || L.mime || 'video/mp4' });
    const seg = { id: `${++L.seq}_${Math.round(started * 1000)}`, start: started, end, dur: end - started, size: blob.size, inDb: false };

// 遅延時間＋10分（最低5分）より古い区間は自動で削除
function retention() {
  const cut = nowS() - Math.max(L.delay + 600, 300);
  const busy = s => s === L.cur || (L.pre && L.pre.seg === s);
  while (L.segs.length > 3 && L.segs[0].end < cut && !busy(L.segs[0])) dropOldest();
  if (!LDB.ok) while (L.bytes > 350e6 && L.segs.length > 3 && !busy(L.segs[0])) dropOldest(); // 保存先が使えない時はメモリ上限
}
function dropOldest() { const s = L.segs.shift(); L.bytes -= s.size; ldbDel(s.id); }

/* --- 再生（2つの<video>を交互に使い、次の区間を先読みして途切れを減らす） --- */
const lvVids = () => [$('#lvA'), $('#lvB')];
const shownVideo = () => document.querySelector('.lv-main.show');
const hiddenVideo = () => { const [a, b] = lvVids(); return a.classList.contains('show') ? b : a; };
async function setSrc(el, seg) {
  const blob = await ldbGet(seg.id); if (!blob) return false;
  if (el._url) URL.revokeObjectURL(el._url);
  el._url = URL.createObjectURL(blob); el._seg = seg; el.src = el._url; el.load();
  return true;
}
function waitReady(el) {
  return new Promise(res => {
    if (el.readyState >= 2) return res();
    const f = () => { el.removeEventListener('loadeddata', f); res(); };
    el.addEventListener('loadeddata', f); setTimeout(f, 2500);
  });
}
async function loadSeg(seg, off, autoplay) {
  const tok = ++L.playTok, el = hiddenVideo();
  el.muted = true; el.playsInline = true;
  if (el._seg !== seg) { if (!(await setSrc(el, seg))) return false; }
  if (L.pre && L.pre.el === el) L.pre = null;
  await waitReady(el); if (tok !== L.playTok) return false;
  const dur = isFinite(el.duration) && el.duration > 0 ? el.duration : seg.dur;
  try { el.currentTime = Math.max(0, Math.min(off, dur - 0.05)); } catch (_) {}
  if (autoplay) { try { await el.play(); } catch (_) {} } else el.pause();
  if (tok !== L.playTok) return false;
  const old = shownVideo();
  el.classList.add('show'); if (old && old !== el) { old.classList.remove('show'); old.pause(); }
  L.cur = seg; L.waitNext = false;
  return true;
}
const findSeg = t => L.segs.find(s => s.end > t) || null;
function nextSegOf(seg) { const i = L.segs.indexOf(seg); return i >= 0 ? (L.segs[i + 1] || null) : (L.segs.find(s => s.start >= seg.end - 0.05) || null); }
async function playAt(t, autoplay = true) {
  const seg = findSeg(t); if (!seg) return false;

}
function viewTime() { const v = shownVideo(); return L.cur && v ? L.cur.start + (v.currentTime || 0) : null; }
function advance() {
  if (L.paused || !L.cur) return;
  const nx = nextSegOf(L.cur);
  if (!nx) { L.waitNext = true; return; }
  if (L.pre && L.pre.seg === nx && L.pre.ready) {
    const h = L.pre.el, old = shownVideo(); L.pre = null;
    h.play().catch(() => {});
    h.classList.add('show'); if (old && old !== h) { old.classList.remove('show'); old.pause(); }
    L.cur = nx; L.playTok++;
  } else loadSeg(nx, 0, true);
}
lvVids().forEach(v => v.addEventListener('ended', () => { if (v.classList.contains('show')) advance(); }));
function preloadNext() {
  if (!L.cur || L.paused || L.pre || L.loading) return;
  const nx = nextSegOf(L.cur); if (!nx) return;
  const el = hiddenVideo();
  L.pre = { seg: nx, el, ready: false };
  const job = L.pre;
  (el._seg === nx ? Promise.resolve(true) : setSrc(el, nx)).then(ok => {
    if (!ok || L.pre !== job) return;
    waitReady(el).then(() => { if (L.pre !== job) return; try { el.currentTime = 0; } catch (_) {} el.pause(); job.ready = true; });
  });
}

/* --- 操作 --- */
function setDelay(d) {
  d = Math.round(clamp(d, 2, 10800));
  L.delay = d; settings.liveDelay = d; saveSettings();
  L.follow = true; L.paused = false;
  if (L.segs.length) {
    const t = nowS() - d;
    if (t >= L.segs[0].start) { L.loading = true; playAt(t).finally(() => { L.loading = false; }); }
    else { L.cur = null; L.pre = null; lvVids().forEach(v => { v.pause(); v.classList.remove('show'); }); }
  }
  retention(); updateLiveUI();
  toast(`遅延を ${fmtLag(d)} にしました`);
  if (d >= 300) updateQuota().then(free => {
    const need = bitrate() / 8 * (d + 600);
    if (free != null && free < need * 1.1) toast(`⚠ 空き容量が足りない可能性があります（目安 ${Math.round(need / 1e6)}MB 必要）`);
  });
}
function togglePause() {
  if (!L.cur) return;
  const v = shownVideo();
  if (!L.paused) { L.paused = true; if (v) v.pause(); L.pre = null; }
  else {
    L.paused = false;
    if (L.delay <= 30) { L.follow = true; L.loading = true; playAt(nowS() - L.delay).finally(() => { L.loading = false; }); } // 短い遅延：設定の遅れに戻る
    else { L.follow = false; if (v) v.play().catch(() => {}); }                                                         // 長い遅延：止めた所から続きを再生
  }
  updateLiveUI();
}
function stepFrozen(d) {
  if (!L.paused || !L.cur) return;
  const v = shownVideo(); if (!v) return;
  const dur = isFinite(v.duration) ? v.duration : L.cur.dur;
  const t = v.currentTime + d;
  if (t < 0) { const i = L.segs.indexOf(L.cur); if (i > 0) { const p = L.segs[i - 1]; loadSeg(p, p.dur + t, false); } return; }
  if (t > dur) { const n = nextSegOf(L.cur); if (n) loadSeg(n, t - dur, false); return; }
  v.currentTime = clamp(t, 0, Math.max(0, dur - 0.05));
}
function seekTo(t) {
  if (!L.segs.length) return;
  const lo = L.segs[0].start, hi = L.segs[L.segs.length - 1].end - 0.3;
  L.follow = false; L.pre = null; L.loading = true;
  playAt(clamp(t, lo, hi), !L.paused).finally(() => { L.loading = false; });
  updateLiveUI();
}
function followDelay() {
  L.follow = true; L.paused = false; L.pre = null;
  const t = nowS() - L.delay;
  if (L.segs.length && t >= L.segs[0].start) { L.loading = true; playAt(t).finally(() => { L.loading = false; }); }
  else { L.cur = null; lvVids().forEach(v => { v.pause(); v.classList.remove('show'); }); }
  updateLiveUI();
}
function clearLiveData() {
  confirmBox('録画データをすべて削除して空き容量を戻しますか？<br>（カメラが動いていれば、ここから新しく録画を続けます）', '削除', () => {
    L.playTok++; L.cur = null; L.pre = null; L.paused = false; L.follow = true;
    lvVids().forEach(v => { v.pause(); v.classList.remove('show'); if (v._url) { URL.revokeObjectURL(v._url); v._url = null; } v._seg = null; v.removeAttribute('src'); });
    L.segs = []; L.bytes = 0; ldbClear(); L.recStart = nowS();
    updateQuota(); updateLiveUI(); toast('録画データを削除しました');
  }, true);
}
function liveStop() {
  L.gen++; clearTimeout(L.segTimer);
  if (L.rec && L.rec.state !== 'inactive') { try { L.rec.stop(); } catch (_) {} }
  L.rec = null; stopTracks();
  $('#lvPip').srcObject = null;
  // 録画済みの区間は残す（カメラ停止後も追っかけ再生・巻き戻しで振り返れる）
  L.follow = false; L.paused = true; L.pre = null;
  lvVids().forEach(v => v.pause());
  if (L.wake) { L.wake.release().catch(() => {}); L.wake = null; }
  if (!L.segs.length) lvMsg('<big>カメラ停止中</big><small>「● カメラ開始」を押すと、指定した時間だけ遅れた映像を表示します</small>');
  updateLiveUI();
}
async function requestWake() { try { if (navigator.wakeLock) L.wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
function applyMirror() { ['#lvA', '#lvB', '#lvPip'].forEach(s => $(s).classList.toggle('mirror', L.mirror)); }
function updateLiveUI() {
  const on = !!L.stream;
  const s = $('#lvStart'); s.textContent = on ? '■ カメラ停止' : '● カメラ開始'; s.classList.toggle('primary', !on); s.classList.toggle('danger', on);
  document.querySelectorAll('.lv-dseg button').forEach(b => b.classList.toggle('on', +b.dataset.d === L.delay));
  const preset = LIVE_SHORT.includes(L.delay) || LIVE_LONG.includes(L.delay);
  const mi = $('#lvMin'); mi.classList.toggle('on', !preset); if (!preset && document.activeElement !== mi) mi.value = Math.round(L.delay / 60);
  $('#lvMirror').classList.toggle('on', L.mirror);
  $('#lvPipBtn').classList.toggle('on', L.pip); $('#lvPip').classList.toggle('hide', !L.pip || !on);
  const p = $('#lvPause');
  p.disabled = !L.cur;
  p.classList.toggle('paused', L.paused && !!L.cur);
  p.textContent = L.paused && L.cur ? (L.delay <= 30 ? '▶ 再開（設定の遅れに戻る）' : '▶ 再開（止めた所から続き）') : '❚❚ 一時停止（フリーズ）';
  $('#lvBack').disabled = $('#lvFwd').disabled = !(L.paused && L.cur);
  $('#lvFreeze').classList.toggle('show', L.paused && !!L.cur);
  $('#lvFollow').hidden = L.follow || !L.stream;

/* =====================================================================
   描いた矢印のとおりに動く（ルート再生）
   カット・ドリブル・スクリーン → 描き始めの近くの選手の移動ルート
   パス → 始点の近くの選手から終点の近くの選手へボールが飛ぶ
   順番：描いた順。パスの後に描いた動きはパスが届いてから。スクリーンの後に描いたカットはスクリーンが止まってから

const RT = { active: false, faces: {}, screens: new Set(), plan: null, mtgCache: null };
const ROUTE_SPEED = { cut: 4.2, dribble: 3.4, screen: 3.4 }; // m/秒（1.0x）

function nearestPiece(board, x, y, max, filt) {
  let best = null, bd = max;
  for (const p of board.pieces) {
    if (filt && !filt(p)) continue;
    if (p.team === 'd' && !board.showDef) continue;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bd) { bd = d; best = p; }

// 描いた線を選手に自動で紐づける（スマートルート認識）
function assignDrawing(d, board = S, quiet = false) {
  if (!d || !d.pts || d.pts.length < 2) return null;
  const [x0, y0] = d.pts[0], [x1, y1] = d.pts[d.pts.length - 1];
  if (d.type === 'cut' || d.type === 'dribble' || d.type === 'screen') {
    const p = nearestPiece(board, x0, y0, 1.3);
    if (p) {
      d.pid = p.id;
      if (!quiet) toast(`✏️ ${p.label}${p.team === 'o' ? '番' : ''}の${{ cut: 'カット', dribble: 'ドリブル', screen: 'スクリーン' }[d.type]}として登録 —「▶ 再生」で線のとおりに動きます`);
    } else { delete d.pid; if (!quiet) toast('線の始まりの近くに選手がいないため、ただの線として描きました'); }
    return p;

    const f = nearestPiece(board, x0, y0, 1.6, p => p.team === 'o') || holder;
    const t = f ? nearestPiece(board, x1, y1, 2.2, p => p.team === 'o' && p.id !== f.id) : null;
    if (f && t) { d.from = f.id; d.to = t.id; if (!quiet) toast(`🏀 ${f.label}番 → ${t.label}番 のパスとして登録`); }

function routePath(d, startXY) {

function buildRoutePlan(B) {

  const act = lines.filter(d => (d.type === 'pass' ? (d.from && d.to && d.from !== d.to) : !!d.pid) && B.pieces.some(p => p.id === (d.pid || d.from)));

  const base = {};
  for (const p of B.pieces) base[p.id] = [p.x, p.y];
  const seen = new Set();
  for (const d of act) if (d.type !== 'pass' && !seen.has(d.pid)) { seen.add(d.pid); base[d.pid] = [d.pts[0][0], d.pts[0][1]]; }
  const firstBall = act.find(d => d.type === 'pass' || d.type === 'dribble');
  const holder0 = firstBall ? (firstBall.type === 'pass' ? firstBall.from : firstBall.pid) : (B.ball.holder || null);
  const pos = {}; for (const id in base) pos[id] = base[id].slice();

      const A = pos[d.from], Bp = pos[d.to], dur = Math.max(0.4, Math.hypot(A[0] - Bp[0], A[1] - Bp[1]) / PASS_SPEED);

      lastPass = start + dur; screensEnd = 0;
      free[d.from] = Math.max(free[d.from] || 0, lastPass); free[d.to] = Math.max(free[d.to] || 0, lastPass);
    } else {

    .concat(passes.map(p => ({ t: p.start, p }))).sort((a, b) => a.t - b.t);
  const total = Math.max(0.5, ...segs.map(s => s.end), ...passes.map(p => p.end)) + 0.4;

}
function routeStateAt(plan, t) {

      const a = pointAt(s.P, Math.min(s.L, at + 0.35)), b = pointAt(s.P, Math.max(0, at - 0.05));
      if (Math.hypot(a.x - b.x, a.y - b.y) > 0.01) faces[s.pid] = Math.atan2(a.x - b.x, a.y - b.y); // 進行方向を向く
      screens.delete(s.pid);
    } else if (s.type === 'screen') {

    if (t >= p.end) { holder = p.to; continue; }

    target.ball.holder = st.holder;

function applyRoutes(plan, t) {

// MTG：紐づけたプレーが矢印だけでできている場合、ルート再生を細かいコマに変換して動画と同期
function routeKeysForClip(lp, c) {
  const key = `${lp.id}|${lp.updatedAt}|${c.in}|${c.out}`;
  if (RT.mtgCache && RT.mtgCache.key === key) return RT.mtgCache.keys;
  const board = clone(lp.board), plan = buildRoutePlan(board);
  if (!plan) { RT.mtgCache = { key, keys: null }; return null; }
  const keys = [], n = Math.max(2, Math.ceil(plan.total / 0.2));
  for (let i = 0; i <= n; i++) {
    const t = plan.total * i / n, st = routeStateAt(plan, t);
    applyRouteState(st, board);

/* =====================================================================
   セットプレーの一連の動き：ステップ記録＆自動再生（2D・3D共通）

const STEP_SEC = 1.6; // 1ステップの移動にかける時間（1.0x）
const PB = { playing: false, t: 0, rate: 1, last: 0, sel: -1, mode: 'steps', prefer: null };
function stepKeys() { return (S.steps || []).map((x, i) => Object.assign({ t: i * STEP_SEC }, x)); }
function stepEnd() { return Math.max(0, ((S.steps || []).length - 1) * STEP_SEC); }
function addStep() {
  pbPause();

  pushHistory();
  const k = snapKey(0); delete k.t;
  S.steps.push(k);
  PB.t = (S.steps.length - 1) * STEP_SEC; PB.sel = -1;
  commit();
  const n = S.steps.length;
  toast(n === 1 ? 'Step 1（スタートの配置）を記録 → 駒とボールを動かして「＋ステップ」' : `Step ${n} を記録しました（▶ で Step 1 から自動再生）`);
}
function pbEnd() { return PB.mode === 'routes' && RT.plan ? RT.plan.total : stepEnd(); }
function pbApply(t) { if (PB.mode === 'routes' && RT.plan) applyRoutes(RT.plan, t); else applyInterp(stepKeys(), t); }

// ▶ 再生：「動き記録」のステップ、または描いた矢印のルートを再生
function pbPlay(forceMode) {

  const plan = buildRoutePlan(S);
  if (!hasSteps && !plan) { toast('矢印（カット・ドリブル・パス・スクリーン）を描くか、「● 動き記録」で動きを作ると再生できます'); return; }
  let mode = typeof forceMode === 'string' ? forceMode : (hasSteps && plan ? PB.prefer : (plan ? 'routes' : 'steps'));
  if (!mode) {
    openModal(`<h2>▶ どちらを再生しますか？</h2>
      <div class="alist" style="margin-top:12px">
        <button class="btn primary" data-a="routes">✏️ 描いた矢印のとおりに動かす</button>
        <button class="btn" data-a="steps">● 記録した動き（${S.steps.length}ステップ）</button>
      </div>`, el => el.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { PB.prefer = b.dataset.a; closeModal(); pbPlay(b.dataset.a); })));
    return;
  }
  if (mode !== PB.mode) PB.t = 0;

  if (PB.t >= pbEnd() - 0.01) PB.t = 0;

function jumpStep(i) {

function openStepMenu(i) {

function openStepsMore() {

    <p class="msub" style="margin-bottom:12px">「＋ステップ」で今の駒とボールの位置を順番に記録 → ▶で自動再生。ステップ番号を1回タップで移動、もう1回で上書き／挿入／削除。<br>記録したステップは「＋ 保存」「上書き」でセットプレーと一緒に保存されます。</p>
    <div class="alist">

      <button class="btn" data-a="close" style="justify-content:center">閉じる</button>
    </div>`, el => {

/* =====================================================================
   直感ジェスチャー：タップで選択／ダブルタップでパス／コートをタップで向き変更
   ===================================================================== */
function handlePieceTap(id) {
  const now = performance.now();
  if (SEL.lastTap && SEL.lastTap.id === id && now - SEL.lastTap.t < 380) { SEL.lastTap = null; SEL.id = null; passTo(id); return; }
  SEL.lastTap = { id, t: now };
  SEL.id = SEL.id === id ? null : id;
  if (SEL.id && SEL.hintShown < 3) {
    SEL.hintShown++;
    const p = S.pieces.find(q => q.id === id);
    toast(`${p.label}${p.team === 'o' ? '番' : ''}を選択：向けたい方向のコートをタップ／ダブルタップでパス`);
  }
  requestRender();
}
function passTo(id) {
  const p = S.pieces.find(q => q.id === id); if (!p) return;
  if (p.team !== 'o') { toast('パスはオフェンス（1〜5）の選手へ出せます'); return; }
  if (S.ball.holder === id) { toast(`${p.label}番はもうボールを持っています`); return; }
  pbPause(); pushHistory();
  const bc = ballCourt(), from = { x: bc.x, y: bc.y };
  const dist = Math.hypot(p.x - from.x, p.y - from.y), dur = Math.min(750, 260 + dist * 45);
  S.ball.holder = null;
  const t0 = performance.now();
  const step = () => {
    const u = Math.min(1, (performance.now() - t0) / dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    S.ball.x = r2(from.x + (p.x - from.x) * e); S.ball.y = r2(from.y + (p.y - from.y) * e);
    requestRender();
    if (u < 1) requestAnimationFrame(step);
    else { S.ball.holder = id; S.ball.x = p.x; S.ball.y = p.y; commit(); recordStep(); toast(`🏀 パス → ${p.label}番`); }
  };
  requestAnimationFrame(step);
}
function faceToward(id, cx, cy) {
  const p = S.pieces.find(q => q.id === id); if (!p) return;
  if (Math.hypot(cx - p.x, cy - p.y) < 0.3) return;
  pushHistory();
  if (settings.autoFace) {
    // 自動 → 手動に切替。ほかの選手は今の向きのまま固定する
    settings.autoFace = false; saveSettings(); updateFaceBtns();
    const drib = dribblerId();
    for (const q of S.pieces) {
      if (q.id === id || typeof q.face === 'number') continue;
      const a = T3.avatars && T3.avatars[q.id];
      const y = a && !a.userData.first ? a.userData.yaw : autoYaw(q, drib);
      if (y != null) q.face = Math.round(y * 180 / Math.PI);
    }
    toast('体の向きを「手動」にしました（⚙️メニューで自動に戻せます）');
  }
  p.face = Math.round(Math.atan2(cx - p.x, cy - p.y) * 180 / Math.PI);
  commit(); recordStep();
}

/* =====================================================================
   ● 動き記録（REC）：記録中は駒を動かすたびに自動でステップを追加
   ===================================================================== */
const REC = { on: false, lastAt: 0, base: 0 };
function recToggle() {
  pbPause();
  if (REC.on) {
    REC.on = false; PB.t = stepEnd(); PB.sel = -1; renderSteps(); saveCurrentSoon();
    const n = S.steps.length;
    toast(n > 1 ? `■ 記録終了（${n}ステップ）。下の「▶ 再生」で確認できます` : '■ 記録を終了しました（駒を動かすとステップが増えます）');
    const pb = $('#stPlay'); pb.classList.add('flash'); setTimeout(() => pb.classList.remove('flash'), 2400);
    return;
  }
  if (S.steps && S.steps.length) {
    openModal(`<h2>● 動き記録</h2><p class="msub">このプレーには ${S.steps.length} ステップの動きが記録されています。</p>
      <div class="alist" style="margin-top:14px">
        <button class="btn primary" data-a="new">● 最初から記録し直す（今の配置がStep 1）</button>
        <button class="btn" data-a="add">＋ 続きを記録する</button>
        <button class="btn" data-a="c" style="justify-content:center">やめる</button>
      </div>`, el => {
      el.querySelector('[data-a=c]').addEventListener('click', closeModal);
      el.querySelector('[data-a=new]').addEventListener('click', () => { closeModal(); startRec(false); });
      el.querySelector('[data-a=add]').addEventListener('click', () => { closeModal(); startRec(true); });
    });
    return;
  }
  startRec(false);
}
function startRec(append) {
  pushHistory();
  if (!append || !Array.isArray(S.steps)) S.steps = [];
  SEL.id = null;
  REC.on = true;
  if (!S.steps.length) { const k = snapKey(0); delete k.t; S.steps.push(k); }
  REC.base = S.steps.length; REC.lastAt = 0;
  PB.t = stepEnd(); renderSteps(); requestRender();
  toast('● 記録中：駒やボールを動かすたびに自動で記録。終わったら「■ 記録停止」');
}
// 記録中に駒が動いたら呼ぶ。1.5秒以内に続けて動かした駒は同じステップにまとめる（同時の動き）
function recordStep() {
  if (!REC.on) return;
  const k = snapKey(0); delete k.t;
  const now = performance.now();
  if (S.steps.length > REC.base && now - REC.lastAt < 1500) S.steps[S.steps.length - 1] = k;
  else S.steps.push(k);
  if (S.steps.length > 40) S.steps.length = 40;
  REC.lastAt = now; PB.t = stepEnd();
  renderSteps(); saveCurrentSoon();
  const b = $('#recBadge'); b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick');
}

/* --- 自動トレース（実験機能）：ローカル動画のフレームを解析して作戦盤へ反映 --- */
function openTrace() {
  if (!player || !player.isLocal) {
    openModal(`<h2>🧪 自動トレース（実験機能）</h2>
      <p class="msub" style="font-size:15px;color:var(--text)">YouTubeの映像は、セキュリティ上の制限で中身（ピクセル）を解析できません。</p>
      <p class="msub" style="margin-top:10px">YouTubeでは代わりに、クリップに<b>ステップを記録したセットプレーを紐づける「同時シンクロ再生」</b>を使ってください（クリップの「⋯」→ 編集 →「動画と同時シンクロ再生するセットプレー」）。動画の再生・一時停止・ループ・倍速に合わせて作戦盤が自動で動きます。<br><br>自動トレースは「📁」から読み込んだ<b>端末内の動画ファイル</b>で使えます。</p>
      <div class="mactions"><button class="btn primary" data-x="c">閉じる</button></div>`, el => el.querySelector('[data-x=c]').addEventListener('click', closeModal));
    return;
  }
  const tg = kfTarget();
  const a = tg ? tg.in : LV.el.currentTime;
  const b = tg && tg.out != null ? tg.out : Math.min(LV.el.duration || a + 8, a + 8);
  openModal(`<h2>🧪 自動トレース（実験機能）</h2>
    <p class="msub">${fmt(a)}〜${fmt(b)} の映像を0.25秒ごとに解析し、<b>ボール（オレンジ色）の移動</b>と<b>選手の動きの重心</b>を作戦盤に線で描きます。固定カメラの映像ほど正確です。</p>
    <label>映像の撮り方</label>
    <select id="trMap"><option value="half">ハーフコート：ゴールが画面の奥（ベースラインの反対側から撮影）</option><option value="full">フルコート：サイドライン側から横向きに撮影</option></select>
    <div class="mactions"><button class="btn" data-x="c">キャンセル</button><button class="btn primary" data-x="go">解析開始</button></div>`, el => {
    el.querySelector('[data-x=c]').addEventListener('click', closeModal);
    el.querySelector('[data-x=go]').addEventListener('click', () => { const m = el.querySelector('#trMap').value; closeModal(); runTrace(a, b, m); });
  });
}
async function runTrace(a, b, mapMode) {
  const el = LV.el; el.pause();
  if (b - a < 0.5) { toast('解析する区間が短すぎます'); return; }
  const W = 160, H = 90, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const seek = t => new Promise(res => { const done = () => { el.removeEventListener('seeked', done); res(); }; el.addEventListener('seeked', done); el.currentTime = t; setTimeout(done, 1500); });
  const ballPts = [], movePts = [];
  let prev = null;
  try {
    for (let t = a; t <= b + 1e-6; t += 0.25) {
      await seek(t);
      cx.drawImage(el, 0, 0, W, H);
      const d = cx.getImageData(0, 0, W, H).data;
      let bx = 0, by = 0, bn = 0, mx = 0, my = 0, mn = 0;
      for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
        const R = d[i], G = d[i + 1], B = d[i + 2];
        if (R > 150 && G > 50 && G < 175 && B < 95 && R - G > 45 && R - B > 100) { bx += x; by += y; bn++; }
        if (prev && Math.abs(R - prev[i]) + Math.abs(G - prev[i + 1]) + Math.abs(B - prev[i + 2]) > 90) { mx += x; my += y; mn++; }
      }
      if (bn >= 3 && bn < W * H * 0.05) ballPts.push([bx / bn / W, by / bn / H]);
      if (mn >= 25) movePts.push([mx / mn / W, my / mn / H]);
      prev = d;
      toast(`🧪 解析中… ${Math.round((t - a) / (b - a) * 100)}%`);
    }
  } catch (e) { toast('⚠ この動画は解析できませんでした'); return; }
  await seek(a);
  const toCourt = ([u, v]) => mapMode === 'full' ? [r2(clamp(u * 28, -1, 29)), r2(clamp(v * 15, -1, 16))] : [r2(clamp(28 - v * 14, 13.8, 29)), r2(clamp(u * 15, -1, 16))];
  const smooth = pts => pts.map((p, i) => { const w = pts.slice(Math.max(0, i - 1), i + 2); return [w.reduce((s, q) => s + q[0], 0) / w.length, w.reduce((s, q) => s + q[1], 0) / w.length]; });
  const thin = pts => { const out = []; for (const p of pts) { const l = out[out.length - 1]; if (!l || Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.35) out.push(p); } return out; };
  const ballPath = thin(smooth(ballPts).map(toCourt)), movePath = thin(smooth(movePts).map(toCourt));
  if (ballPath.length < 2 && movePath.length < 2) { toast('動きを検出できませんでした（固定カメラ・明るい映像で試してください）'); return; }
  pushHistory();
  if (mapMode === 'full') S.court = 'full';
  if (ballPath.length >= 2) {
    S.drawings.push({ type: 'free', color: '#f97316', pts: ballPath });
    S.ball.holder = null; S.ball.x = ballPath[0][0]; S.ball.y = ballPath[0][1];
  }
  if (movePath.length >= 2) S.drawings.push({ type: 'cut', color: '#7c3aed', pts: movePath });
  commit();
  toast(`🧪 トレース完了：ボール ${ballPath.length}点（オレンジ線）／動きの重心 ${movePath.length}点（紫の矢印）`);
}
$('#vTrace').addEventListener('click', openTrace);

/* =====================================================================
   イベント登録
   ===================================================================== */
$('#catTabs').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  settings.cat = b.dataset.cat; saveSettings(); renderTabs(); renderList();
  $('#playList').scrollTop = 0;
});
$('#playList').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { openActions(more.dataset.more); return; }
  const it = e.target.closest('.play-item');
  if (it) loadPlay(it.dataset.id);
});
$('#toolBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-tool]'); if (!b) return;
  if (T3.active && b.dataset.tool !== 'move') toast(b.dataset.tool === 'erase' ? '3Dのまま、消したい線をなぞると消えます' : '3Dの床に直接描けます（カメラを回すときは「駒を移動」に戻す）');
  settings.tool = b.dataset.tool;
  if (LINE_TOOLS.includes(settings.tool)) settings.lastLine = settings.tool;
  saveSettings(); updateTools();
});
$('#btnColor').addEventListener('click', () => {
  settings.color = COLORS[(COLORS.indexOf(settings.color) + 1) % COLORS.length];
  if (settings.tool === 'move' || settings.tool === 'erase') { if (!settings.pencil) settings.tool = settings.lastLine; }
  saveSettings(); updateTools();
});
$('#courtSeg').addEventListener('click', e => { const b = e.target.closest('[data-court]'); if (b) setCourt(b.dataset.court); });
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
$('#btnDef').addEventListener('click', toggleDef);
$('#btnUndo').addEventListener('click', undo);
$('#btnClear').addEventListener('click', clearDrawings);
$('#btnSaveNew').addEventListener('click', openSaveNew);
$('#btnSaveTop').addEventListener('click', openSaveNew);
$('#btnOverwrite').addEventListener('click', () => {
  const cl = !S.playId && S.clipId && getClip(S.clipId);
  if (cl) return confirmBox(`クリップ「${esc(cl.title)}」に紐づく盤面を、現在の盤面で更新しますか？`, '更新', () => updateClipBoard(cl.id));
  const p = S.playId && getPlay(S.playId); if (!p) return;
  confirmBox(`「${esc(p.title)}」を現在の盤面で上書きしますか？`, '上書き', () => overwritePlay(p.id));
});
$('#curPlay').addEventListener('click', openMemo);
$('#btnSidebar').addEventListener('click', () => {
  if (settings.mode === 'mtg') { app.classList.toggle('pb-open'); return; }
  settings.sidebar = !settings.sidebar; saveSettings(); updateSidebar();
});
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
function toggleTheme() {
  settings.theme = settings.theme === 'wood' ? 'white' : 'wood'; saveSettings(); layout(); renderList(); renderQuick();
  if (T3.renderer) updateCourtTexture();
}
function togglePencil() {
  settings.pencil = !settings.pencil; settings.pencilAsked = true; saveSettings(); updateTools();
  toast(settings.pencil ? 'ペン優先：ペン＝線を描く／指＝駒を動かす' : '指もペンも選択中のツールで操作します');
}
$('#btnMenu').addEventListener('click', openMenu);

document.addEventListener('keydown', e => {
  if (modal.classList.contains('open')) { if (e.key === 'Escape') closeModal(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  // MTG分析モード用キーボード操作（Mac・外付けキーボード）
  if (settings.mode !== 'mtg' || e.target.closest('input,textarea')) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'arrowleft') { e.preventDefault(); skip(-5); }
  else if (k === 'arrowright') { e.preventDefault(); skip(5); }
  else if (k === 'i') markIn();
  else if (k === 'o') markOut();
});

window.addEventListener('pagehide', saveCurrentNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCurrentNow(); });

if ('ResizeObserver' in window) new ResizeObserver(() => layout()).observe(wrap);
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* =====================================================================
   起動
   ===================================================================== */
renderTools(); renderTabs(); renderList();
updateSidebar(); updateThemeBtn(); updatePencilBtn();
updateCourtSeg(); updateDefBtn(); updateUndo(); updateCurPlay();
if (V.cur && getVideo(V.cur)) $('#vUrl').value = getVideo(V.cur).url;
updateInOut(); updateRateUI(); renderClips();
updateViewSeg(); updateLiveUI(); updateFaceBtns(); renderSteps();
if (settings.mode === 'live') settings.mode = 'court'; // カメラは操作してから起動する
setMode(settings.mode);
layout();

// 起動時に使い方ガイドを自動表示（「次回から自動表示しない」をONにした端末を除く）
if (!guideHidden()) openHelp();
})();
</script>
</body>
</html>
